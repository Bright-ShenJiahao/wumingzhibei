# 心魔强化学习（用户定 2026-10-31）：不画画面加速跑「心魔 vs 测试玩家」几万局，进化策略训练心魔走位网络。
# 用户定 11/01：只手动跑（Actions 页面 Run workflow，分支选 preview）；结果推到 preview，不碰正式站。
# 公开仓库的 GitHub Actions 免费、不限分钟；单次最长 6 小时。
name: 心魔强化学习
on:
  workflow_dispatch:
    inputs:
      minutes: { description: '训练多少分钟', default: '120' }
      focus: { description: '重点练哪几把（抽到的机会是其他武器的 3 倍）', default: 'halberd,bow,blade' }
      weapons: { description: '只练哪几把（逗号隔开，留空=全部）：staff,hammer,stone,halberd,blade,bow', default: '' }
permissions: { contents: write }
concurrency: { group: xinmo-train, cancel-in-progress: false }
jobs:
  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow fonttools brotli && npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: 打包游戏
        run: python3 tools/build.py && git checkout art/fonts/result.ttf || true
      - name: 强化学习
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/xinmo_rl/selfplay.cjs --minutes ${{ github.event.inputs.minutes || '120' }} --pop 16 --eps 4 --evaln 150 --weapons "${{ github.event.inputs.weapons }}" --focus "${{ github.event.inputs.focus }}"
      - name: 提交模型和训练报告
        run: |
          git config user.name "xinmo-train-bot"
          git config user.email "xinmo-train-bot@users.noreply.github.com"
          git add data/xinmo_model.json docs/xinmo_train || true
          if git diff --cached --quiet; then echo "没有新结果"; exit 0; fi
          git commit -m "心魔强化学习 $(date -u +%Y-%m-%d)：模型与训练报告（自动）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin preview && git push origin HEAD:preview
