# 心魔强化学习（用户定 2026-10-31）：不画画面加速跑「心魔 vs 测试玩家」几万局，进化策略训练心魔走位网络。
# 每周自动跑一次（在模仿学习之后），也可以在 Actions 页面手动跑；对打测试赢过规则版才把 inGame 标成 true 上场。
# 公开仓库的 GitHub Actions 免费、不限分钟；单次最长 6 小时。
name: 心魔强化学习
on:
  schedule: [{ cron: '0 21 * * 0' }]   # 每周一 06:00（日本时间），比模仿学习晚 2 小时
  workflow_dispatch:
    inputs:
      minutes: { description: '训练多少分钟', default: '120' }
permissions: { contents: write }
concurrency: { group: xinmo-train, cancel-in-progress: false }
jobs:
  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow fonttools brotli && npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: 打包游戏
        run: python3 tools/build.py && git checkout art/fonts/result.ttf || true
      - name: 强化学习
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/xinmo_rl/selfplay.cjs --minutes ${{ github.event.inputs.minutes || '120' }} --pop 16 --eps 4
      - name: 提交模型和训练报告
        run: |
          git config user.name "xinmo-train-bot"
          git config user.email "xinmo-train-bot@users.noreply.github.com"
          git add data/xinmo_model.json docs/xinmo_train || true
          if git diff --cached --quiet; then echo "没有新结果"; exit 0; fi
          git commit -m "心魔强化学习 $(date -u +%Y-%m-%d)：模型与训练报告（自动）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main && git push origin HEAD:main
