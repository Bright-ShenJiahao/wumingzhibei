[build]
  publish = "."
  # 只有 main 分支才部署；preview 分支是给用户本地试玩用的（raw.githack 读取），不消耗 Netlify 构建时间
  # 训练任务只改 data/、docs/：这种提交不重新部署（省构建时间）
  ignore = "test \"$BRANCH\" != \"main\" || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data' ':(exclude)docs'"

[build.environment]
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# manifest 必须以 JSON 类型返回，Chrome 才会当成"可安装的网页应用"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# 首页不要长期缓存：微信/QQ 的内置浏览器缓存很顽固，改了代码看不到更新
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 素材在 pack/ 里，网址带内容指纹（?v=哈希），内容一变网址就变：可以放心长期缓存
[[headers]]
  for = "/pack/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# 版本号文件：页面靠它判断有没有新版本，不能被缓存
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
