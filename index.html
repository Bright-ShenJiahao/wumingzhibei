      const x = x0 + i * (sw + gap), y = y0;
      ctx.fillStyle = got ? 'rgba(60,40,12,.85)' : 'rgba(18,12,26,.55)';
      ctx.fillRect(x, y, sw, sw);
      ctx.strokeStyle = got ? '#ffd86e' : 'rgba(255,255,255,.22)';
      ctx.lineWidth = got ? 2 : 1.5;
      if (!got) ctx.setLineDash([4, 4]);
      ctx.strokeRect(x + .5, y + .5, sw - 1, sw - 1);
      ctx.setLineDash([]);
      ctx.save(); ctx.globalAlpha = got ? 1 : .32;
      ctx.translate(0, 0);
      icon(k, x + sw / 2, y + sw / 2 - 2, 1.5, false);
      ctx.restore();
      if (got) { ctx.fillStyle = '#ffd86e'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('✓', x + sw - 12, y + 13); }
    }
    return { x: x0, y: y0, w: total, h: sw };
  }

  function drawDialogue(W, H) {
    if (S.phase !== 'wake' || S.li < 0 || S.li >= LINES.length) return;
    const line = LINES[S.li];
    const pop = Math.min(1, Math.max(0, (line.d - S.lineT) / .12));
    const small = H < 520;                       // 手机横屏：底部空间不够，台词框放到上面，别挡住地上的主角和武器
    const bw = Math.min(620, W * .86), bh = small ? 62 : 74;
    const x = (W - bw) / 2, y = small ? 74 : H - bh - 26;
    ctx.save();
    ctx.globalAlpha = .55 + .45 * pop;
    ctx.fillStyle = 'rgba(16,10,22,.9)'; ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = '#c9971f'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, bw - 2, bh - 2);
    // 说话人
    const nm = (window.TITLE && TITLE.playerName && TITLE.playerName()) || '我';
    ctx.font = 'bold 13px "PingFang SC","Noto Sans CJK SC",sans-serif';
    ctx.fillStyle = '#ffd86e'; ctx.fillText(nm, x + 16, y - 6);
    ctx.fillStyle = 'rgba(201,151,31,.9)'; ctx.fillRect(x + 16, y - 3, 34, 1.5);
    // 正文（逐字出现）
    ctx.font = 'bold ' + (small ? 16 : 18) + 'px "PingFang SC","Noto Sans CJK SC",sans-serif';
    const shown = line.s.slice(0, Math.max(1, S.cn || 1));
    ctx.fillStyle = '#f2e6c9'; ctx.fillText(shown, x + 16, y + (small ? 38 : 42));
    // 继续提示
    if (S.lineT < line.d - .6) {
      ctx.globalAlpha = .4 + .5 * Math.abs(Math.sin(S.t * 4));
      ctx.fillStyle = '#ffd86e'; ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'right'; ctx.fillText('▼', x + bw - 14, y + bh - 12); ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  function draw() {
    if (S.mode !== 'play') return false;
    const W = cv.width / DPR, H = cv.height / DPR;
    const vw = viewW();
    fitImg();
    SC = FIT.k * DPR;                 // 设备像素 / 世界单位（按舞台框缩放）
    OXs = BOX.x * DPR;                // 世界原点 X
    const OYw = (BOX.y * DPR) / SC;   // 世界原点 Y（折算成世界单位，drawChar 没有 OY，只能加在坐标上）
    drawArt(vw);
    ctx.setTransform(SC, 0, 0, SC, OXs, BOX.y * DPR);
    // 地上的武器 + 主角（按 y 排序）
    const list = [];
    for (const it of S.items) list.push({ y: it.y, d: () => drawItem(it, S.t) });
    list.push({ y: S.hero.y, d: () => {
      const h = S.hero;
      let f = 'idle';
      if (h.st === 'down' || h.st === 'getup') f = h.st;
      else if (h.st === 'walk') f = 'walk' + ([1, 2, 3, 2][Math.floor(h.t * 8) % 4]);
      const oldStageH = (cv.height / DPR) * ((matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints || 0) > 0) ? .51 : .47);
      const sizeKeep = HERO_SCALE * oldStageH * 572 / (446 * Math.max(1, BOX.h));
      drawChar('hero', f, h.x, h.y + OYw, h.f < 0, 1, false, sizeKeep * depthScale(h.y));
    } });
    list.sort((a, b) => a.y - b.y).forEach(o => o.d());
    // 门的光晕 / 提示
    if (S.took >= 3) {
      // 门槛前的暖光：走进这个光圈就出门
      const th = P.threshold();
      const a = .28 + .18 * Math.abs(Math.sin(S.t * 3));
      const g2 = ctx.createRadialGradient(th[0], th[1] + 10, 2, th[0], th[1] + 10, 60);
      g2.addColorStop(0, 'rgba(255,214,140,' + a + ')');
      g2.addColorStop(1, 'rgba(255,214,140,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(th[0], th[1] + 10, 60, 26, 0, 0, 7); ctx.fill();
    }

    // 屏幕层 UI
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSlots(W, H);
    drawDialogue(W, H);
    if (S.phase === 'free') {
      ctx.textAlign = 'center';
      // 捡起/提醒的消息（黄字，3~5 秒）
      if (S.msgT > 0) {
        ctx.globalAlpha = Math.min(1, S.msgT / .6);
        ctx.font = 'bold 21px "PingFang SC","Noto Sans CJK SC",sans-serif';
        ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,12,6,.85)';
        ctx.strokeText(S.msg, W / 2, H - 66);
        ctx.fillStyle = '#ffd86e'; ctx.fillText(S.msg, W / 2, H - 66);
        ctx.globalAlpha = 1;
      }
      // 常驻提示：字号从 14 放大到 20
      ctx.font = 'bold 20px "PingFang SC","Noto Sans CJK SC",sans-serif';
      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,12,6,.75)';
      const t = S.took >= 3 ? '走到门口出去' : `捡起地上的武器（${S.took}/3）`;
      ctx.strokeText(t, W / 2, H - 24);
      ctx.fillStyle = 'rgba(246,236,214,.92)'; ctx.fillText(t, W / 2, H - 24);
      ctx.textAlign = 'left';
    }
    // 转场
    if (S.fade > 0) { ctx.fillStyle = `rgba(255,255,255,${S.fade})`; ctx.fillRect(0, 0, W, H); }
    if (S.out > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, S.out / .6)})`; ctx.fillRect(0, 0, W, H); }
    return true;
  }

  // ---------- 样式：开场只留摇杆和静音 ----------
  const style = document.createElement('style');
  style.textContent = `
    body.wzb-room #top, body.wzb-room #wp button[data-w], body.wzb-room #bWeapon, body.wzb-room #bA,
    body.wzb-room #bR, body.wzb-room #help { display: none !important; }
    body.wzb-wake #joy { display: none !important; }
    body.wzb-wake #bA, body.wzb-wake #bR { display: none !important; }
  `;
  document.head.appendChild(style);
  roomImg = new Image();
  // 农房内景只有新档开场才用：点「开始游戏」进开场时再下载（prefetch），没预取到就在 begin() 里补上
  const prefetch = () => { if (!roomImg.src) roomImg.src = (typeof ASSETS !== 'undefined' && ASSETS.room) || ''; };

  window.ROOM = {
    prefetch,
    begin: (...a) => { prefetch(); return begin(...a); },
    blocks: () => S.mode === 'play',
    draw,
    update: (dt) => update(dt),
    active: () => S.mode === 'play',
    skip: () => { S.mode = 'off'; document.body.classList.remove('wzb-room', 'wzb-wake'); },
    place: (px, py) => { S.hero.x = px; S.hero.y = py; },   // 调试用：摆位置
    geo: () => ({ doorL: P.doorL(), doorR: P.doorR(), thr: P.threshold(), top: P.floorTop(), bot: P.floorBot() }),
    info: () => ({ phase: S.phase, took: S.took, x: Math.round(S.hero ? S.hero.x : 0), viewW: Math.round(viewW()), msg: S.msg, msgT: +S.msgT.toFixed(1), out: +S.out.toFixed(2), items: S.items.map(i => ({ k: i.k, x: Math.round(i.x), y: Math.round(i.y), got: i.got })) }),
  };
})();

// 音效：Web Audio 实时合成，不需要外部音频文件。
// 设计思路：每个音效由几层组成（瞬态 + 主体 + 尾音），用滤波后的噪声做挥风、布料、泥土，
// 用正弦/三角波做身体闷响和木头敲击，用不和谐泛音做金属声；每次播放带一点随机音高和音量，
// 避免连打时像机关枪；按画面左右位置做立体声；主输出经过轻微混响和压缩，让所有声音像在同一个空间里。
(() => {
  const KEY = 'wzb-muted';
  let muted = false, pauseDucked = false;
  try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}
  let ac, master, verb, noiseBuf, fallbackEl;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    ac = new A();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .15;
    master = ac.createGain(); master.gain.value = .8;
    master.connect(comp).connect(ac.destination);
    // 短混响：户外村庄，空间感很轻
    const len = Math.floor(ac.sampleRate * .7), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const conv = ac.createConvolver(); conv.buffer = ir;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    verb = ac.createGain(); verb.gain.value = .22;
    verb.connect(conv).connect(lp).connect(master);
    // 共用噪声
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    return ac;
  }
  const R = (a, b) => a + Math.random() * (b - a);

  // 每次播放建立一条输出线：音量 → 立体声 → 主输出 + 混响
  function bus(pan, vol, wet) {
    const g = ac.createGain(); g.gain.value = vol;
    let out = g;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = Math.max(-.8, Math.min(.8, pan || 0)); g.connect(p); out = p; }
    out.connect(master);
    const s = ac.createGain(); s.gain.value = wet; out.connect(s); s.connect(verb);
    return g;
  }
  // 包络：起音 a，持续到 a+d 衰减到 0
  function env(param, t, peak, a, d, curve = 'exp') {
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(peak, t + a);
    if (curve === 'exp') param.exponentialRampToValueAtTime(0.0001, t + a + d);
    else param.linearRampToValueAtTime(0.0001, t + a + d);
  }
  // 滤波噪声层：f0→f1 频率扫动
  function noise(out, t, { type = 'bandpass', f0 = 1000, f1 = f0, q = 1, gain = .5, a = .005, d = .1, hp = 0 }) {
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = R(.9, 1.1);
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + a + d);
    const g = ac.createGain(); env(g.gain, t, gain, a, d);
    let node = src.connect(f);
    if (hp) { const h = ac.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = hp; node = node.connect(h); }
    node.connect(g).connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + a + d + .05);
  }
  // 音调层：p0→p1 音高扫动
  function tone(out, t, { type = 'sine', p0 = 200, p1 = p0, gain = .5, a = .002, d = .1, lp = 0 }) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(p0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, p1), t + a + d);
    const g = ac.createGain(); env(g.gain, t, gain, a, d);
    let node = o;
    if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node = o.connect(f); }
    node.connect(g).connect(out);

  }
  // 金属泛音（不和谐倍频），用于刀光、亮刀预警
  function ring(out, t, base, gain, d) {
    [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(out, t, { p0: base * m, p1: base * m * .995, gain: gain / (i + 1.3), a: .001, d: d / (1 + i * .5) }));
  }

  const S = {
    // —— 主角挥空 ——
    swing_staff(o, t, k) {   // 粗木棍：低沉、慢一点的"呼——"
      noise(o, t, { f0: 260 * k, f1: 900 * k, q: 1.4, gain: .55, a: .07, d: .16 });
      noise(o, t + .05, { type: 'lowpass', f0: 500, f1: 180, gain: .35, a: .03, d: .14 });
    },
    swing_knife(o, t, k) {   // 柴刀：短促尖锐的"嗖"
      noise(o, t, { f0: 1600 * k, f1: 5200 * k, q: 2.2, gain: .45, a: .035, d: .09 });
      noise(o, t + .02, { f0: 900 * k, f1: 2400 * k, q: 1, gain: .22, a: .02, d: .08 });
    },
    swing_stone(o, t, k) {   // 甩手扔石子：短风声 + 指尖弹出
      noise(o, t, { f0: 700 * k, f1: 2000 * k, q: 1.6, gain: .35, a: .03, d: .08 });
      tone(o, t + .04, { type: 'triangle', p0: 1800 * k, p1: 1200, gain: .08, d: .02 });
    },
    // —— 命中 ——
    hit_staff(o, t, k) {     // 木棍砸肉：闷响 + 木头"梆"
      tone(o, t, { p0: 150 * k, p1: 52, gain: .9, d: .14 });
      noise(o, t, { type: 'lowpass', f0: 1800, f1: 250, gain: .6, a: .001, d: .09 });
      noise(o, t, { f0: 820 * k, q: 9, gain: .55, a: .001, d: .07 });
      tone(o, t, { type: 'triangle', p0: 390 * k, p1: 330, gain: .18, d: .06 });
    },
    hit_knife(o, t, k) {     // 刀砍：锐利的"嚓"+ 布料撕开 + 轻闷响
      noise(o, t, { type: 'highpass', f0: 4200 * k, gain: .55, a: .001, d: .05 });
      noise(o, t + .005, { f0: 2400 * k, f1: 900, q: 1.8, gain: .5, a: .002, d: .12 });
      tone(o, t, { p0: 120 * k, p1: 55, gain: .55, d: .1 });
      ring(o, t, 1900 * k, .05, .18);
    },
    hit_stone(o, t, k) {     // 石子打中："啪"的硬碰
      noise(o, t, { f0: 2600 * k, q: 6, gain: .45, a: .001, d: .035 });
      tone(o, t, { p0: 210 * k, p1: 80, gain: .55, d: .08 });
    },
    finisher(o, t, k) {      // 第三段重击：在命中声上加低频冲击和一点空间
      tone(o, t, { p0: 95 * k, p1: 34, gain: 1, d: .38 });
      noise(o, t, { type: 'lowpass', f0: 900, f1: 120, gain: .6, a: .002, d: .28 });
      noise(o, t + .01, { f0: 300, f1: 120, q: 1, gain: .3, a: .01, d: .3 });
    },
    // —— 身体动作 ——
    roll(o, t, k) {          // 翻滚：两下布料摩擦 + 泥土
      noise(o, t, { f0: 700 * k, f1: 1500, q: .9, gain: .22, a: .05, d: .12 });
      noise(o, t + .14, { f0: 900 * k, f1: 1900, q: .9, gain: .2, a: .05, d: .14 });
      noise(o, t + .1, { type: 'lowpass', f0: 380, f1: 150, gain: .28, a: .02, d: .2 });
    },
    land(o, t, k) {          // 被打飞落地：闷"咚" + 尘土
      tone(o, t, { p0: 90 * k, p1: 40, gain: .8, d: .2 });
      noise(o, t, { type: 'lowpass', f0: 600, f1: 150, gain: .55, a: .002, d: .22 });

    },
    enemyDown(o, t, k) {     // 敌人被打倒：更重的倒地
      tone(o, t, { p0: 75 * k, p1: 34, gain: .9, d: .32 });

    hurt(o, t, k) {          // 主角挨打：闷击 + 短促的吸气声（低音量，偏闷）
      tone(o, t, { p0: 125 * k, p1: 48, gain: .9, d: .16, lp: 600 });

    },
    heroDown(o, t, k) {      // 主角倒下：重落地 + 低沉尾音

    enemySwing(o, t, k) {    // 敌人出手的风声（比主角低沉，便于分辨）

    sling(o, t, k) {         // 投石索甩出

    bow(o, t, k) {           // 弓弦"嘣" + 箭离弦

      tone(o, t, { type: 'sawtooth', p0: 420 * k, p1: 360, gain: .06, a: .001, d: .12, lp: 1500 });

    },
    fireLand(o, t, k) {      // 火箭落地起火："轰"+ 噼啪

      for (let i = 0; i < 9; i++) noise(o, t + .05 + Math.random() * .6, { f0: R(1800, 4200), q: 6, gain: R(.08, .2), a: .001, d: R(.01, .03) });
    },

    },
    perfect(o, t, k) {       // 完美闪避：一声脆亮的"叮"
      tone(o, t, { type: 'sine', p0: 1760 * k, p1: 2640, gain: .16, a: .002, d: .28 });
      tone(o, t + .04, { type: 'triangle', p0: 2640 * k, p1: 3520, gain: .08, a: .002, d: .2 });
      noise(o, t, { type: 'highpass', f0: 5000, gain: .05, a: .001, d: .06 });
    },
    charge(o, t, k) {        // 蓄力开始：低频"嗡"
      tone(o, t, { type: 'sawtooth', p0: 90 * k, p1: 150, gain: .07, a: .08, d: .5 });
      tone(o, t, { type: 'sine', p0: 180 * k, p1: 300, gain: .05, a: .1, d: .45 });
    },
    crack(o, t, k) {         // 钝器命中：木头的脆响，和闷响叠在一起用
      noise(o, t, { type: 'highpass', f0: 2600, gain: .2, a: .001, d: .04 });
      noise(o, t + .004, { f0: 1200 * k, f1: 620, q: 2, gain: .16, a: .001, d: .07 });
      tone(o, t, { type: 'triangle', p0: 330 * k, p1: 180, gain: .1, a: .001, d: .06 });
    },
    blip(o, t, k) {          // 台词逐字跳出的电子音（老游戏机那种短促方波）
      tone(o, t, { type: 'square', p0: 760 * k, p1: 520, gain: .085, a: .001, d: .035, lp: 2600 });
      tone(o, t + .012, { type: 'square', p0: 1140 * k, p1: 900, gain: .04, a: .001, d: .022, lp: 3200 });
    },
    pickup(o, t, k) {        // 捡起武器：两声轻快的上行
      tone(o, t, { type: 'triangle', p0: 620 * k, p1: 700, gain: .16, a: .002, d: .1 });
      tone(o, t + .07, { type: 'triangle', p0: 940 * k, p1: 1000, gain: .12, a: .002, d: .16 });
      noise(o, t, { type: 'highpass', f0: 3200, gain: .05, a: .001, d: .05 });
    },
    tick(o, t, k) {          // 台词跳出：轻轻一声「嗒」
      noise(o, t, { f0: 2400 * k, q: 5, gain: .18, a: .001, d: .03 });
      tone(o, t, { type: 'triangle', p0: 900 * k, p1: 620, gain: .1, a: .002, d: .06 });
    },
  };

  // 静音：把主输出在 0.1 秒内渐变到 0，正在播的音效和配音跟着立刻听不见；取消静音再渐变回 .8
  function applyMute() {
    if (muted && fallbackEl) { try { fallbackEl.pause(); } catch (e) {} }   // <audio> 兜底播放的配音不走 Web Audio，得单独停
    if (fallbackEl && !muted) fallbackEl.volume = pauseDucked ? .3 : 1;
    if (!ac || !master) return;
    const t = ac.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(muted ? 0 : pauseDucked ? .24 : .8, t + .1);
  }
  function updateButton() {
    const b = document.getElementById('bMute'); if (!b) return;
    b.textContent = muted ? '🔇' : '🔊'; b.title = muted ? '开启音效' : '静音';
    b.setAttribute('aria-label', b.title); b.classList.toggle('on', muted);
  }
  const b = document.getElementById('bMute');
  function toggleMute() {
    muted = !muted; try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
    if (!muted) init();
    applyMute(); updateButton();
  }
  if (b) b.addEventListener('click', toggleMute);
  updateButton();
  // 浏览器要求用户操作后才能出声：第一次按键/触摸时启动
  // iPhone：静音拨片打开时网页声音默认也会被静音，这里声明为"媒体播放"让它照常出声（iOS 17+ 支持）
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  // 浏览器要求用户点一下之后才能出声：每次点击/按键都尝试解锁，并播放一段无声音频（iOS 需要）
  function unlock() {
    if (muted || !init()) return;
    if (ac.state !== 'running') ac.resume();
    try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}
    preloadVoices();
  }
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, unlock, { passive: true }));

  const VOL = { swing_staff: .5, swing_knife: .45, swing_stone: .4, hit_staff: .7, hit_knife: .6, hit_stone: .55, finisher: .6, roll: .55, land: .55, enemyDown: .6,
    hurt: .7, heroDown: .7, enemySwing: .4, bladeAlert: .35, sling: .4, bow: .45, fireLand: .55, panel: .42, tick: .3, pickup: .5, blip: .5, crack: .42, food: .55, stamp: .7, wake: .55, perfect: .6, charge: .5 };
  const WET = { finisher: .5, enemyDown: .35, heroDown: .5, bladeAlert: .4, fireLand: .3 };
  const lastAt = {};
  // 配音：ASSETS.voice 里的 mp3，第一次播放时解码并缓存
  const vcache = {};
  // data:URI → 二进制（不用 fetch，部分手机浏览器不支持 fetch data: 地址）
  function b64buf(uri) { const bin = atob(uri.split(',')[1]), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
  function decode(name) {
    const src = ASSETS.voice[name];
    if (!vcache[name]) vcache[name] = (src.startsWith('data:') ? Promise.resolve(b64buf(src)) : fetch(src).then(r => r.arrayBuffer())).then(buf => new Promise((ok, no) => ac.decodeAudioData(buf, ok, no)));
    return vcache[name];
  }
  let preloaded = false;
  function preloadVoices() { if (preloaded || !(typeof ASSETS !== "undefined" && ASSETS) || !ASSETS.voice) return; preloaded = true; for (const n in ASSETS.voice) decode(n).catch(() => {}); }
  async function voice(name, pan = 0) {
    if (muted || !(typeof ASSETS !== "undefined" && ASSETS) || !ASSETS.voice || !ASSETS.voice[name] || !init()) return;
    try {
      if (ac.state !== 'running') await ac.resume();
      const buffer = await decode(name);
      const src = ac.createBufferSource(); src.buffer = buffer;
      src.connect(bus(pan * .5, 1.1, .12)); src.start(); window.__lastVoice = name;
    } catch (e) {
      // 备用：Web Audio 解码失败时，用 <audio> 播放（记下元素，静音时要能立刻停掉）
      try { fallbackEl = new Audio(ASSETS.voice[name]); fallbackEl.volume = 1; fallbackEl.play().catch(() => {}); } catch (e2) {}
    }
  }
  window.SFX = {
    voice,
    // 只读：当前是否静音（js/bgm.js 用它同步背景音乐）
    isMuted: () => muted,
    toggleMute,
    setPauseDucked(value) { pauseDucked = !!value; applyMute(); },
    // name：音效名；pan：-1（左）到 1（右）
    play(name, pan = 0, pitch = 1) {
      if (muted || !S[name]) return;
      if (!init()) return;
      const now = ac.currentTime;
      if (lastAt[name] && now - lastAt[name] < .025) return;   // 同一帧重复触发只播一次
      lastAt[name] = now;
      const o = bus(pan, (VOL[name] || .5) * R(.88, 1.05), WET[name] || .18);
      S[name](o, now + .005, R(.94, 1.06) * pitch);
    },
  };
})();

// 结算分享：手机调系统分享面板，电脑复制到剪贴板，微信里只能提示点右上角。
// 只用浏览器的 Web Share API / clipboard，不引第三方库，也不改别的东西。
(() => {
  const url = () => location.origin + location.pathname;
  const isWeChat = () => /MicroMessenger/i.test(navigator.userAgent || '');
  const fmt = t => { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; };

  // 文案随机挑一条，每次分享不完全一样
  const WIN = [
    r => `我在《无名之辈》里放倒了黄巾头目管亥：击倒 ${r.kills} 人，用时 ${fmt(r.time)}，评价 ${r.rank}。`,
    r => `《无名之辈》序章通关 —— ${r.kills} 杀 · ${fmt(r.time)} · ${r.rank} 评价。这成绩你敢比？`,
    r => `黄巾贼清完了。${fmt(r.time)} 打完序章，评价 ${r.rank}，${r.kills} 个人头。`,
    r => `东汉末年不好混，但我把管亥放倒了：${fmt(r.time)}，评价 ${r.rank}。`,
  ];
  const LOSE = [
    r => `我在《无名之辈》里被黄巾贼放倒了，只击倒 ${r.kills} 人……你来试试？`,
    r => `《无名之辈》：倒在半路，${r.kills} 杀。这黄巾贼比想象中难打。`,
    r => `刚在《无名之辈》里倒下，${r.kills} 杀。不服，再来。`,
  ];

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    try {   // 老浏览器 / 非 https 时的退路
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }

  // 返回值：shared / copied / wechat / cancel / fail
  async function send(r) {
    const pool = r.win ? WIN : LOSE;
    const line = pool[Math.floor(Math.random() * pool.length)](r);
    if (isWeChat()) return 'wechat';   // 微信内置浏览器调不起分享面板
    if (navigator.share) {
      try { await navigator.share({ title: '无名之辈', text: line, url: url() }); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
    }
    return (await copy(line + ' ' + url())) ? 'copied' : 'fail';
  }

  window.SHARE = { send, text: (r) => (r.win ? WIN : LOSE)[0](r) };
})();

// 金币、彩色果与商店。数据存进武器存档，按累计值合并，避免多设备刷钱。
(() => {
  const MAX = 1e9;
  const clamp = n => Math.max(0, Math.min(MAX, Math.floor(Number(n) || 0)));
  const profile = () => window.ARMORY && ARMORY.state ? ARMORY.state() : null;
  let pending = 0, runEarned = 0;

  function walletOf(p) {
    p.wallet = p.wallet && typeof p.wallet === 'object' ? p.wallet : {};
    p.wallet.earned = clamp(p.wallet.earned);
    p.wallet.spent = clamp(p.wallet.spent);
    return p.wallet;
  }
  function fruitOf(p) {
    p.fruit = p.fruit && typeof p.fruit === 'object' ? p.fruit : { got: 6, used: 0 };
    p.fruit.got = clamp(p.fruit.got);
    p.fruit.used = clamp(p.fruit.used);
    return p.fruit;
  }
  function save() { if (window.ARMORY && ARMORY.saveNow) return ARMORY.saveNow(); return false; }
  function balance() { const p = profile(); if (!p) return 0; const w = walletOf(p); return Math.max(0, w.earned - w.spent); }
  function fruitCount() { const p = profile(); if (!p) return 0; const f = fruitOf(p); return Math.max(0, f.got - f.used); }
  function flush() {
    if (!pending) return true;
    const p = profile(); if (!p) return false;
    const w = walletOf(p); w.earned = clamp(w.earned + pending); pending = 0;
    const ok = save(); if (window.SHOP) SHOP.refresh(); return ok;
  }
  function awardKill(z) {
    if (!z || !z.T) return 0;
    const base = (z.T.boss || z.T.chapterBoss) ? 20 : z.T.elite ? 5 : 1;
    let mult = 1;
    if (window.XIAOCHANG && XIAOCHANG.active()) {
      const floor = Number(XIAOCHANG.state()?.floor) || 1;
      mult = floor >= 6 ? 2 : 1 + .1 * (floor - 1);
    } else if (typeof chapter2Run !== 'undefined' && chapter2Run) mult = 1.5;
    const n = Math.max(1, Math.round(base * mult));
    pending += n; runEarned += n;
    return n;
  }
  function startRun() {
    flush();
    runEarned = 0;
  }
  function spendCoins(n) {
    n = Math.floor(Number(n) || 0);
    if (n <= 0) return false;
    flush();
    const p = profile(); if (!p) return false;
    const w = walletOf(p);
    if (w.earned - w.spent < n) return false;
    w.spent = clamp(w.spent + n);
    if (!save()) { w.spent = clamp(w.spent - n); return false; }
    if (window.SHOP) SHOP.refresh();
    return true;
  }
  function addCoins(n) {   // 卖武器所得：记进累计收入
    n = Math.floor(Number(n) || 0); if (n <= 0) return false;
    const p = profile(); if (!p) return false;
    const w = walletOf(p); w.earned = clamp(w.earned + n);
    if (!save()) { w.earned = clamp(w.earned - n); return false; }
    if (window.SHOP) SHOP.refresh();
    return true;
  }
  function addFruits(n) {
    n = Math.floor(Number(n) || 0); if (n <= 0) return false;
    const p = profile(); if (!p) return false;
    const f = fruitOf(p); f.got = clamp(f.got + n);
    if (!save()) { f.got = clamp(f.got - n); return false; }
    if (window.SHOP) SHOP.refresh();
    return true;
  }
  function useFruits(n) {
    n = Math.floor(Number(n) || 0); if (n <= 0) return false;
    const p = profile(); if (!p) return false;
    const f = fruitOf(p);
    if (f.got - f.used < n) return false;
    f.used = clamp(f.used + n);
    if (!save()) { f.used = clamp(f.used - n); return false; }
    if (window.SHOP) SHOP.refresh();
    return true;
  }

  window.WALLET = {
    coins: () => balance() + pending,
    fruits: fruitCount,
    runCoins: () => runEarned,
    pendingCoins: () => pending,
    awardKill, startRun, flush,

  };

  // ---------- 整屏绘制 ----------
  function drawBg(c, W, H) {
    let placed = false;
    if (bgHome && bgHome.complete && bgHome.width) {
      // cover 铺满，再把电视矩形按同一套缩放算出来，保证画面严丝合缝嵌进屏幕
      const s = Math.max(W / bgHome.width, H / bgHome.height);
      const dw = bgHome.width * s, dh = bgHome.height * s, dx = (W - dw) / 2, dy = (H - dh) / 2;
      c.drawImage(bgHome, dx, dy, dw, dh);
      L.tvX = dx + TV.x * dw; L.tvY = dy + TV.y * dh;
      L.tvW = TV.w * dw; L.tvH = TV.h * dh;
      placed = true;
    }
    if (!placed) {   // 图还没加载好：先用深色打底，避免白屏
      c.fillStyle = '#241816'; c.fillRect(0, 0, W, H);
      L.tvX = W * TV.x; L.tvY = H * TV.y; L.tvW = W * TV.w; L.tvH = H * TV.h;
    }
    // 左侧/上下轻微压暗，让标题和按钮更清楚（不挡住画面本身）
    const gl = c.createLinearGradient(0, 0, W * .42, 0);

  // 离屏图层：尺寸跟着当前缩放走，避免推镜时糊成马赛克
  function layerFor(w, h) {
    if (!layerCv || Math.abs(layerX - w) > 2 || layerCv.height !== h) {
      layerCv = layerCv || document.createElement('canvas');
      layerCv.width = w; layerCv.height = h; layerX = w;
    }
    return layerCv;
  }

  function drawTV(c) {
    const x = L.tvX, y = L.tvY, w = L.tvW, h = L.tvH;
    if (!demoCv || !maskCv) return;
    // 推镜时按放大后的实际像素尺寸画，避免糊
    const zoom = c.getTransform ? Math.sqrt(Math.abs(c.getTransform().a)) || 1 : 1;
    const lw = Math.max(2, Math.round(w * zoom)), lh = Math.max(2, Math.round(h * zoom));

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, lw, lh);
    // 演示画面：铺满、裁边、不拉伸
    const da = demoCv.width / demoCv.height, sa = lw / lh;
    let sw = demoCv.width, sh = demoCv.height, sx0 = 0, sy0 = 0;
    if (sa < da) { sw = demoCv.height * sa; sx0 = (demoCv.width - sw) / 2; }

    g.drawImage(demoCv, sx0, sy0, sw, sh, 0, 0, lw, lh);

    g.fillStyle = 'rgba(0,0,0,.22)';
    for (let yy = 0; yy < lh; yy += 3) g.fillRect(0, yy, lw, 1);

    const rg = g.createRadialGradient(lw / 2, lh / 2, Math.min(lw, lh) * .25, lw / 2, lh / 2, Math.max(lw, lh) * .62);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.55)');
    g.fillStyle = rg; g.fillRect(0, 0, lw, lh);

    c.imageSmoothingEnabled = true;
    c.drawImage(cv, x, y, w, h);
    c.restore();
  }

  function draw() {
    if (S.mode === 'game') return false;
    const W = cv.width / DPR, H = cv.height / DPR;

    // 转场：向电视推近
    let zoom = 1;
    if (S.mode === 'intro') {

    ctx.save();
    if (zoom > 1) {

// 白色的雷是张角专属（用户批准的敌人特效例外）。
(() => {
  const ROUND_T = 10, BASE = [3, 4, 4, 5];
  let S = null;   // 本场状态
  const img = k => IMG['zj_' + k];
  const stageY = () => ALTAR_STAGE.y - 4 + Math.sin(performance.now() / 1000 * 2.2) * 2.5;
  const lamps = () => props.filter(p => p.lamp);   // 含已熄灭的（顺序固定）
  const GUA = ['乾', '兑', '离', '震', '坤', '艮', '坎', '巽'];   // 先天八卦顺时针，对面两盏互为一对
  const BATCH = [[0, 4], [2, 6], [1, 5], [3, 7]];   // 乾坤、离坎、兑艮、震巽：每轮亮对面的两盏
  const batch = r => BATCH[r].map(i => lamps()[i]).filter(Boolean);
  const lit = () => props.filter(p => p.lamp && p.g === 'fudeng');
  const rnd2 = (a, b) => a + Math.random() * (b - a);
  function pic(k, x, y, s, a = 1, anchorBottom = false) {
    const im = img(k); if (!im || !im.naturalWidth) return;
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    ctx.globalAlpha = a; ctx.drawImage(im, Math.round(x - w / 2), Math.round(anchorBottom ? y - h : y - h / 2), Math.round(w), Math.round(h)); ctx.globalAlpha = 1;
  }

  const vo = n => { if (window.SFX && SFX.voice) SFX.voice(n); };   // 关键台词才有语音，其余只跳字
  function start() {
    S = { phase: 'open', t: 0, round: -1, rt: 0, queue: [], hz: [], perfect: false, shatterT: -1, lid: null, flash: 0, prevLeft: 0, batchDone: [],
      zjX: 141, zjY: 112, face: 1, summonRound: 0, spawned: [], dueT: 0, boss: null, castT: 0, pose: 'situp', cheerDone: false };
    chapter2Run.mode = 'zj';
    props.forEach((p, i) => { if (p.lamp) p.lit = false; });
    say('祭坛之上，一口黑棺……', 3);
  }

  // ---- 危险物 ----
  function thunderAt(x, y, warn = 1) { S.hz.push({ k: 'thunder', x, y, t: -warn, r: 24 }); }
  function addRound() {
    const r = S.round, set = batch(r);
    set.forEach(p => { if (p.g === 'fudeng') p.lit = true; });
    const left = lit().length - set.filter(p => p.g === 'fudeng').length;   // 以前没打灭的灯
    const prevCleared = r > 0 && S.batchDone[r - 1] ? 1 : 0;
    const n = Math.max(1, BASE[r] - prevCleared + left);
    S.queue = [];
    const span = ROUND_T - 3;
    for (let i = 0; i < n; i++) S.queue.push({ at: 1 + span * i / n, k: 'thunder' });
    if (r >= 1) for (let i = 0; i < r + 1; i++) S.queue.push({ at: 2 + i * (span / (r + 1)), k: 'fu' });
    if (r >= 2) for (let i = 0; i < r - 1; i++) S.queue.push({ at: 3 + i * 3.4, k: 'fire' });
    S.queue.sort((a, b) => a.at - b.at);
    if (left) say(`还有${left}盏灯亮着，雷更密了！`, 2.5);
    else if (r > 0) say('灯灭了，雷势稍缓。', 2);
  }
  function cast(e) {
    S.castT = .5;
    if (e.k === 'thunder' && S.needLeigong) { S.needLeigong = false; vo('zj_leigong'); say('张角：“左零右火，雷公助我！”', 2.2); tutorialQueue.push({ text: '躲开天雷，打灭金圈里发光的灯！（每盏三下）', time: 4.5 }); }
    if (e.k === 'thunder') thunderAt(hero.x + rnd2(-6, 6), hero.y + rnd2(-4, 4), 1.05);
    else if (e.k === 'fu') S.hz.push({ k: 'fu', x: e.x ?? ALTAR_STAGE.x, y: e.y ?? ALTAR_STAGE.y + 10, t: 0, vx: 0, vy: 0, fr: Math.floor(Math.random() * 3) });
    else if (e.k === 'fire') {   // 地火预判：砸在主角正在打的那盏灯周围（没有亮灯就砸主角所在行）
      const ls = lit().filter(p => p.lit).sort((p, q) => Math.hypot(p.x - hero.x, p.y - hero.y) - Math.hypot(q.x - hero.x, q.y - hero.y));
      const tx = ls[0] ? ls[0].x : hero.x, ty = ls[0] ? ls[0].y : hero.y;
      const y = Math.max(M.top + 8, Math.min(M.bot - 6, ty));
      const add = (x, yy, d) => { if (x < arenaL + 10 || x > lockR - 10 || yy < M.top || yy > M.bot) return; S.hz.push({ k: 'fire', x, y: yy, t: -d, r: 16, fr: Math.floor(Math.random() * 4) }); };
      // 一整排横火：从目标灯向两边烧开
      for (let x = arenaL + 14; x <= lockR - 14; x += 26) add(x, y, 1 + Math.abs(x - tx) / 420);
      // 张角到这盏灯的连线：从施法者一路烧过来
      const ox = e.ox ?? ALTAR_STAGE.x, oy = Math.max(M.top + 4, e.oy ?? M.top + 4), L = Math.hypot(tx - ox, y - oy), n = Math.floor(L / 24);
      for (let i = 1; i < n; i++) add(ox + (tx - ox) * i / n, oy + (y - oy) * i / n, .9 + i * .06);
    }
  }
  // 黄巾力士：跺地震波（暗橙预警圈，1.5 秒后炸开）
  function golems(dt) {
    for (const z of zs) {
      if (z.type !== 'yellow-golem' || z.dead || z.air) continue;
      z.slamCd = (z.slamCd ?? 2.5) - dt; z.grabCd = (z.grabCd ?? 1.5) - dt;
      if (z.stun > .12 && !(z.pantT > 0)) z.stun = .12;   // 大块头：普通攻击只顿一下
      z.hurlT = Math.max(0, (z.hurlT || 0) - dt); z.pantT = Math.max(0, (z.pantT || 0) - dt);
      if (z.pantT > 0) { z.stun = Math.max(z.stun || 0, .05); z.moving = false; continue; }   // 跺地后喘气：破绽
      const d = Math.hypot(hero.x - z.x, (hero.y - z.y) * 2);
      // 抓投：贴身伸手抓，0.6 秒前摇，抓到就把主角扔出去
      if (z.grab) {
        z.grab.t += dt; z.st = 'wind'; z.t = 0; z.moving = false;
        if (z.grab.t >= .6) {
          z.grab = null; z.st = 'strike'; z.t = 0; z.hurlT = .45; sfx('enemySwing', z.x);
          if (Math.abs(hero.x - z.x) < 30 && Math.abs(hero.y - z.y) < 14 && hero.inv <= 0) {
            hero.f = Math.sign(z.x - hero.x) || 1; dmgHero(2, z);
            if (hero.air) hero.ax = (hero.ax || 0) * 1.7;   // 扔得更远
            floaters.push({ x: z.x, y: z.y - 60, t: 0, txt: '起！' }); shake = .3;
          }
        }
        continue;
      }
      if (z.grabCd <= 0 && Math.abs(hero.x - z.x) < 26 && Math.abs(hero.y - z.y) < 12 && (z.st === 'move' || z.st === 'idle') && !(z.stun > 0)) {
        z.grabCd = 4; z.f = Math.sign(hero.x - z.x) || z.f; z.grab = { t: 0 };
        floaters.push({ x: z.x, y: z.y - 60, t: 0, txt: '抓！' }); continue;
      }
      if (z.slamCd <= 0 && d < 90 && (z.st === 'move' || z.st === 'idle') && !(z.stun > 0)) {
        z.slamCd = 6; z.f = Math.sign(hero.x - z.x) || z.f; z.st = 'wind'; z.t = -.5;   // 比普通出手多蓄 0.5 秒
        S.hz.push({ k: 'slam', x: z.x + z.f * 24, y: z.y, t: -1.5, r: 42, src: z });
        floaters.push({ x: z.x, y: z.y - 60, t: 0, txt: '喝！' });
      }
    }
  }
  function updateHz(dt) {
    for (const h of S.hz) {
      h.t += dt;
      if (h.k === 'thunder') {
        if (h.t >= 0 && !h.done) {
          h.done = true; shake = Math.max(shake, .3); sfx('crack', h.x); S.flash = .18;
          if (Math.abs(hero.x - h.x) < h.r && Math.abs(hero.y - h.y) < h.r * .5) dmgHero(2, { x: h.x, y: h.y });
        }
        if (h.t > .9) h.dead = true;
      } else if (h.k === 'fu') {
        const dx = hero.x - h.x, dy = hero.y - 14 - h.y, d = Math.hypot(dx, dy) || 1;
        const sp = h.t < 2.8 ? 62 : 90, ax = dx / d * sp, ay = dy / d * sp;
        h.vx += (ax - h.vx) * Math.min(1, dt * 2.2); h.vy += (ay - h.vy) * Math.min(1, dt * 2.2);
        h.x += h.vx * dt; h.y += h.vy * dt;
        if (Math.abs(hero.x - h.x) < 9 && Math.abs(hero.y - 14 - h.y) < 14) { dmgHero(1, { x: h.x, y: h.y }); h.dead = true; sfx('crack', h.x); S.hz.push({ k: 'puff', x: h.x, y: h.y, t: 0 }); }
        if (h.t > 5) h.dead = true;
      } else if (h.k === 'fire') {
        if (h.t > 0 && h.t < .6 && Math.abs(hero.x - h.x) < h.r && Math.abs(hero.y - h.y) < 11) dmgHero(1.5, { x: h.x, y: h.y });
        if (h.t > .7) h.dead = true;
      } else if (h.k === 'slam') {
        if (h.src && (h.src.dead || h.src.stun > 0) && h.t < 0) { h.dead = true; continue; }   // 被打断就不炸
        if (h.t >= 0 && !h.done) { h.done = true; shake = Math.max(shake, .35); sfx('land', h.x); if (h.src && !h.src.dead) h.src.pantT = 1.2;
          if (Math.abs(hero.x - h.x) < h.r && Math.abs(hero.y - h.y) < h.r * .45) dmgHero(3, { x: h.x, y: h.y }); }
        if (h.t > .45) h.dead = true;
      } else if (h.k === 'shot') {
        h.x += h.vx * dt; h.y += h.vy * dt;
        if (Math.abs(hero.x - h.x) < 7 && Math.abs(hero.y - 14 - h.y) < 12) { dmgHero(1, { x: h.x, y: h.y }); h.dead = true; S.hz.push({ k: 'puff', x: h.x, y: h.y, t: 0 }); }
        if (h.t > 2.2) h.dead = true;
      } else if (h.k === 'puff') { if (h.t > .4) h.dead = true; }
    }
    S.hz = S.hz.filter(h => !h.dead);
  }

  // ---- 阶段流程 ----
  // 选了张梁 → 曹军追张宝，张宝败逃到祭台；反之亦然（调试直进时随机）
  function fledType() { const r = chapter2Run && chapter2Run.route; return r === 'zhang-liang' ? 'zhang_bao' : r === 'zhang-bao' ? 'zhang_liang' : (Math.random() < .5 ? 'zhang_liang' : 'zhang_bao'); }
  function monsters(round) {
    const gx = ALTAR_STAGE.x, gy = M.top + 6;
    // 第一轮：黄巾力士 + 2 小兵；第二轮：另一路被曹军追败、逃回祭台的将军（半血、不再召兵）+ 1 枪兵
    const list = round === 0 ? ['yellow-golem', 'blade', 'yellow-spear'] : [fledType(), 'yellow-spear'];
    list.forEach((t, i) => { spawn(t, gx + (i - .5) * 30, gy + (i % 2) * 8); const z = zs[zs.length - 1]; z.zjAdd = true; z.st = 'move';
      if (z.T.chapterBoss) { z.fled = true; z.hp = z.T.hp * .5; z.summonedHalf = true; z.saidIntro = true; S.fled = z; } });
    sfx('bladeAlert', gx);
  }
  function descend() {
    S.phase = 'p3'; S.t = 0;
    const x = ALTAR_STAGE.x, y = M.top + 14;
    spawn('zhang_jiao', x, y);
    const z = zs[zs.length - 1]; S.boss = z;
    if (S.angry) { z.hp = z.T.hp * .9; z.angry = true; }   // 多打了一个将军：张角少 10% 血，但出手更快（平衡难度）
    z.summonedHalf = true; z.f = hero.x < z.x ? -1 : 1; z.cd = 1.2; z.zjTele = 4; z.zjThunder = 3; z.zjFire = 8; z.zjFu = 4;
    z.st = 'move'; z.t = 0; z.jump = { t: 0, h0: y - ALTAR_STAGE.y, first: true };   // 从法台飞身跳下
    say('张角：“既如此，本天师亲自送你上路！”', 3); vo('zj_jump');
  }
  function update(dt) {
    if (!S || !chapter2Run || chapter2Run.battle !== 6) return;
    S.t += dt; S.flash = Math.max(0, S.flash - dt); S.castT = Math.max(0, S.castT - dt);
    golems(dt); updateHz(dt);
    // 打灭灯：没轮到的灯被打灭 = 乱了阵序，立刻多降两道雷，破阵也不再掉血
    if (S.phase !== 'open') for (const p of lamps()) if (p.g !== 'fudeng' && !p.zjSeen) {
      p.zjSeen = true;
      if (p.lit && S.phase === 'p1' && !S.saidLamp) { S.saidLamp = true; say('张角：“竖子，敢毁我法灯！”', 2); }
      if (!p.lit && S.phase === 'p1') { const first = !S.outOfOrder; S.outOfOrder = true; thunderAt(hero.x, hero.y, .8); thunderAt(hero.x + rnd2(-30, 30), hero.y + rnd2(-8, 8), 1.1); say(first ? '阵序乱了！要打金圈里发光的灯！' : '阵序乱了！天雷降！', first ? 3.5 : 1.8); }
    }
    if (S.shatterT >= 0) { S.shatterT += dt; if (S.shatterT > 1.1) { const b = props.find(p => p.g === 'bagua'); if (b) b.broken = true, b.alpha = 0; S.shatterT = -2; }
      if (S.shatterT > .5 && S.perfect) for (let i = props.length - 1; i >= 0; i--) if (props[i].lamp) { S.hz.push({ k: 'puff', x: props[i].x, y: props[i].y - 12, t: 0 }); props.splice(i, 1); } }
    if (S.phase !== 'open' && !S.perfect && S.phase !== 'dead' && lamps().length && !lit().length) {   // 八盏全灭：阵破
      S.perfect = true; S.shatterT = 0; S.flash = .3; shake = .35; sfx('finisher', ALTAR_C.x);
      floaters.push({ x: ALTAR_C.x, y: ALTAR_C.y - 20, t: 0, txt: '八卦阵破！', big: true });
      say('张角：“八卦……破了？！”', 3);
      S.queue = []; S.hz = S.hz.filter(h => h.k === 'puff'); S.pose = 'float';
      if (S.phase === 'p1') { S.phase = 'p2'; S.t = 0; S.summonRound = 0; S.sumT = 2; S.pose = 'summon'; tutorialQueue.push({ text: '张角：“黄巾力士，何在！”', time: 2.5 }); vo('zj_golem'); }
    }
    const t = S.t;
    if (S.phase === 'open') {
      hero.inv = Math.max(hero.inv, .3);
      if (t > .9 && !S.struck) { S.struck = true; S.flash = .5; shake = .5; sfx('crack', 141); S.hz.push({ k: 'thunder', x: 141, y: 120, t: 0, r: 0, done: true }); }
      if (t > 1.3 && !S.lid) { S.lid = { x: 141, y: 98, vx: 70, vy: -150, rot: 0, t: 0 }; const c = props.find(p => p.g === 'coffin'); if (c) { c.g = 'coffin_open'; const m = ASSETS.props.coffin_open; if (m) { c.dw = c.dw; } } sfx('land', 141); }
      if (S.lid && !S.saidRise && t > 1.8) { S.saidRise = true; say('张角：“吾……未死！”', 1.6); }
      if (S.lid) { const l = S.lid; l.t += dt; l.vy += 380 * dt; l.x += l.vx * dt; l.y += l.vy * dt; l.rot += dt * 7; if (l.y > 150) { l.y = 150; l.vx = l.vy = 0; } }
      if (t < 2.2) S.pose = 'situp';
      else if (t < 4.2) { const u = (t - 2.2) / 2; S.pose = 'float'; S.zjX = 141 + (ALTAR_STAGE.x - 141) * u; S.zjY = 108 + (ALTAR_STAGE.y - 4 - 108) * u - Math.sin(u * Math.PI) * 30; }
      else if (!S.shout) { S.shout = true; S.zjX = ALTAR_STAGE.x; S.zjY = ALTAR_STAGE.y - 4; S.pose = 'thunder'; vo('zj_rise'); say('张角：“苍天已死，黄天当立！”', 3.2); shake = .3; S.flash = .3; }
      if (t > 5.8) { S.phase = 'p1'; S.t = 0; S.round = 0; S.rt = 0; addRound(); S.needLeigong = true; }
      return;
    }
    if (S.phase === 'p1') {
      S.rt += dt;
      if (S.perfect) return;
      while (S.queue.length && S.queue[0].at <= S.rt) cast(S.queue.shift());
      if (S.rt >= ROUND_T) {
        const set = batch(S.round);
        S.batchDone[S.round] = set.every(p => p.g !== 'fudeng');
        if (S.round >= 3) { S.phase = 'p2'; S.t = 0; S.summonRound = 0; S.hz = S.hz.filter(h => h.k === 'thunder' && !h.done); say('张角：“黄巾力士，何在！”', 2.5); vo('zj_golem'); S.pose = 'summon'; S.sumT = 1.2; }
        else { S.round++; S.rt = 0; addRound(); }
      }
      S.pose = S.castT > 0 ? 'thunder' : 'float';
      return;
    }
    if (S.phase === 'p2') {
      if (S.sumT > 0) { S.sumT -= dt; if (S.sumT <= 0) { monsters(S.summonRound); S.pose = 'float'; S.next = 0; } return; }
      S.pose = 'float';
      if (S.fled && S.fled.dead && !S.angry) { S.angry = true; say(S.fled.type === 'zhang_bao' ? '张角：“三弟！——竖子，我必杀你！”' : '张角：“二弟！——竖子，我必杀你！”', 3); shake = .4; S.flash = .3; }
      const alive = zs.some(z => !z.dead && z.zjAdd);
      S.next = (S.next || 0) + dt;
      if (S.next > 6) { S.next = 0; thunderAt(hero.x, hero.y, 1.1); S.pose = 'thunder'; }
      if (!alive && S.t > 2) {
        if (S.summonRound === 0) { S.summonRound = 1; S.sumT = 1.2; S.pose = 'summon'; S.t = 0; say(fledType() === 'zhang_bao' ? '张宝：「大哥！曹贼追得紧……我来助你！」' : '张梁：「大哥！曹贼势大……我来助你！」', 3); }
        else descend();
      }
      return;
    }
    if (S.phase === 'p3') {
      const z = S.boss;
      if (z && z.dead && S.phase !== 'dead') {
        S.phase = 'dead'; S.t = 0; S.hz = []; zs.forEach(e => { if (e.zjAdd) e.hp = 0; });
        say('张角：“苍天……亡我……”', 4); vo('zj_die'); shake = .5;
        if (window.CHAPTER2 && CHAPTER2.completeBattle) CHAPTER2.completeBattle(6);
      }
      return;
    }
    if (S.phase === 'dead' && S.t > 2.2 && !S.caoSaid) { S.caoSaid = true; say(chapter2Run && chapter2Run.route === 'zhang-bao' ? '曹操：「张梁已被我斩于阵前！黄巾贼首尽灭——此战，你当居首功！」' : '曹操：「张宝已被我斩于阵前！黄巾贼首尽灭——此战，你当居首功！」', 5); if (window.SFX && SFX.voice) SFX.voice('caocao_win'); }
    if (S.phase === 'dead' && S.t > 5.5 && !S.fin) { S.fin = true; chapter2Run.mode = 'complete'; won = true; }   // 进结算卷轴
  }

  // ---- 决斗中的张角：传送、单雷、半血狂暴 ----
  // ---- 决斗：远程丢符游走 + 三套连招（每套结尾有喘息破绽）+ 半血回法台布雷阵 ----
  const COMBOS = ['leifu', 'shanlei', 'dihuo'];
  const clampX = x => Math.max(arenaL + 24, Math.min(lockR - 24, x)), clampY = y => Math.max(M.top + 6, Math.min(M.bot - 4, y));
  function shot(z) {   // 普攻：直线丢一张符，伤害低
    const sx = z.x + z.f * 10, sy = z.y - 26, ty = hero.y - 14, d = Math.hypot(hero.x - sx, ty - sy) || 1;
    S.hz.push({ k: 'shot', x: sx, y: sy, vx: (hero.x - sx) / d * 150, vy: (ty - sy) / d * 150, t: 0, fr: Math.floor(Math.random() * 3) });
    z.throwT = .3; sfx('sling', z.x);
  }
  function startTele(z, behind) {
    z.tele = { t: 0, done: false, behind }; S.hz.push({ k: 'puff', x: z.x, y: z.y - 20, t: 0 });
  }
  function guaSpots() { return Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4 - Math.PI / 2; return { x: ALTAR_C.x + Math.cos(a) * 120, y: ALTAR_C.y + Math.sin(a) * 30, k }; }); }
  function duel(z, dt) {
    z.castT = Math.max(0, (z.castT || 0) - dt); z.throwT = Math.max(0, (z.throwT || 0) - dt);
    if (z.jump) {   // 跳下法台：弧线落地，落地立刻开打
      const j = z.jump; j.t += dt; const u = Math.min(1, j.t / .7);

function rollFill(pool, budget) {
  const out = [];
  let left = budget;
  for (let guard = 0; guard < 40 && left > 0; guard++) {
    const ok = pool.filter(t => THREAT[t] <= left);
    if (!ok.length) break;
    const t = ok[Math.floor(Math.random() * ok.length)];
    out.push(t); left -= THREAT[t];
  }
  return out;
}

// ---------- 碰撞 ----------
// 竖放拒马（p.vert）：从 p.y（前端）往场地深处延伸 p.d，越往里越偏右 VERT_K
const VERT_K = 0;
const propTop = p => p.y - (p.vert ? p.d : 0);
const propDY = (p, y) => p.vert ? Math.max(0, p.y - p.d - y, y - p.y) : Math.abs(p.y - y);
const propXAt = (p, y) => p.vert ? p.x + ((p.y - Math.max(propTop(p), Math.min(p.y, y))) - p.d / 2) * VERT_K : p.x;
function blocked(x, y) {
  for (const p of props) if (p.solid && Math.abs(x - propXAt(p, y)) < p.w / 2 && y > propTop(p) - 6 && y < p.y + 2) return true;
  return false;
}
function moveEnt(e, dx, dy) {
  if (window.GEAR && e !== hero) { const mult=GEAR.enemyMove(e); dx*=mult; dy*=mult; }
  if (e !== hero && e.halberdBleed > 0 && gameT < e.halberdBleedUntil) { dx *= .9; dy *= .9; }   // 裂伤减速
  e.bx = false;
  if (!blocked(e.x + dx, e.y)) e.x += dx; else e.bx = true;
  if (!blocked(e.x, e.y + dy)) e.y += dy;
  // 被道具挡住时"先往旁边走、绕过道具边缘，再继续前进"（只对敌人；玩家仍会被挡住）
  if (e !== hero) {
    const dir = Math.sign(dx) || e.f || 1;
    const p = props.find(q => q.solid && !q.broken &&
      Math.abs(propXAt(q, e.y) - (e.x + dir * 16)) < q.w / 2 + 14 && propDY(q, e.y) < 20);
    if (p) {
      // 选定绕行方向后至少坚持 0.8 秒，避免每帧上下换方向（看起来在抖）；靠边那侧走不通就直接选另一侧
      if (e.avoidDir == null || gameT > (e.avoidUntil || 0) + 2) {
        e.avoidDir = (e.y <= (propTop(p) + p.y) / 2 ? -1 : 1);
        const gy = e.avoidDir < 0 ? propTop(p) - 22 : p.y + 22;
        if (gy < M.top + 3 || gy > M.bot - 2) e.avoidDir *= -1;
        e.avoidUntil = gameT + .8;
      }
      const goalY = e.avoidDir < 0 ? propTop(p) - 22 : p.y + 22;                              // 让开 22，能看出是绕过去
      const vs = Math.min(3, ((e.T && e.T.spd) || 40) / 60 * 1.7);      // 侧向走速（比它正常速度快一点）
      const ny = e.y + Math.sign(goalY - e.y) * Math.min(vs, Math.abs(goalY - e.y));
      if (ny > M.top + 3 && ny < M.bot - 2 && !blocked(e.x, ny)) e.y = ny;
      else if (gameT > e.avoidUntil) { e.avoidDir *= -1; e.avoidUntil = gameT + .8; }
      if (Math.abs(e.y - goalY) < 1.5) { e.passProp = p; e.passY = goalY; e.avoidDir = null; }   // 已经让开了：记住这条绕行线，直到走过道具
    }
    // 绕行中：在走过道具之前不许再往道具那边靠（否则会在边缘上下来回抖）
    const pp = e.passProp;
    if (pp) {
      if (pp.broken || !pp.solid || Math.abs(e.x - propXAt(pp, e.passY)) > pp.w / 2 + 18) e.passProp = null;
      else if (e.passY < propTop(pp)) e.y = Math.min(e.y, e.passY); else e.y = Math.max(e.y, e.passY);
    }
  } else e.avoidDir = null;
  e.y = Math.max(M.top, Math.min(M.bot, e.y)); e.x = Math.max(10, Math.min(M.W - 10, e.x));
  if (lockR < Infinity) {
    const lo = cam.x + (e === hero ? 12 : 10), hi = Math.min(lockR, cam.x + viewW()) - (e === hero ? 12 : 10);
    e.x = Math.max(lo, Math.min(e.x, Math.max(lo, hi)));   // 敌人也不许被打出场外（否则打不到、卡关）
  }
  if (e === hero && arenaL != null) e.x = Math.max(arenaL + 12, e.x);   // Boss 战场地左边界
}

function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
// 评价：无伤 SSS；被打 1~3 下 S；其余按用时 A~E（分数先这么定，实测后再调）
// 倒下时随机说一句（按打到第几波分档），让每次都死得不太一样
const DEATH_LINES = {
  early: ['这就完了？我连这是哪一年都没问清楚。', '汉朝的路，比我想的难走。'],
  mid: ['黄巾贼……怎么打不完。', '再给我一口气，我还能站起来。'],
  boss: ['差一点……就差这一下！', '管亥，你等着。'],
  any: ['无名之辈，也不能就这么交待在这儿。'],
};
function deathLine() {
  const stage = gateI >= 4 ? 'boss' : gateI >= 2 ? 'mid' : 'early';
  const pool = DEATH_LINES[stage].concat(DEATH_LINES.any);
  return pool[Math.floor(Math.random() * pool.length)];
}
// 评分 = 击杀×10 + 通关数×100 + 通关时间分（(900-秒)×0.4，不封顶）+ 无伤分（最多 +200）
// 死掉没有时间分；每被打 1 下扣 20 分
function scoreOfRun(kills, t, cleared, win, hits) {
  const progress = Math.max(0, Math.min(6, cleared)) * 100;
  const speed = win ? Math.max(0, Math.round((900 - t) * .4)) : 0;
  const safe = Math.max(0, 200 - Math.max(0, Math.min(99, hits || 0)) * 20);
  return kills * 10 + progress + speed + safe;
}

  const t = performance.now() / 1000, pulse = .5 + .5 * Math.sin(t * 2.6);
  const R = 26 + lv * 6;
  // 外层柔光：正常混合压暗一点背景，浅色地面上也能看见
  ctx.save();
  const g = ctx.createRadialGradient(h.x, h.y - 18, 3, h.x, h.y - 18, R);
  g.addColorStop(0, `rgba(255,86,66,${.20 + lv * .035 + pulse * .02})`);

  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(h.x, h.y - 18, R * .9, R * 1.05, 0, 0, 7); ctx.fill();
  ctx.restore();

  for (let i = 0; i < lv; i++) {
    const rx = 15 + i * 3.2, ry = 20 + i * 3.2;
    ctx.save();
    ctx.strokeStyle = `rgba(255,104,82,${.26 - i * .05 + pulse * .03})`;
    ctx.lineWidth = 1.4;
    ctx.shadowColor = 'rgba(255,70,50,.55)';
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.ellipse(h.x, h.y - 17, rx, ry, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
  // 贴地范围圈：淡红，尽量不抢画面
  ctx.save();
  ctx.strokeStyle = `rgba(255,96,78,${.12 + lv * .04})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 24, 10, 0, 0, 7); ctx.stroke();
  ctx.restore();
  // 缓缓上升的火星
  ctx.save();
  for (let i = 0; i < lv * 4; i++) {
    const ph = (t * (.32 + i * .045) + i * .37) % 1;
    const x = h.x + Math.sin(t * 1.6 + i * 2.3) * (9 + lv * 2.4);
    const y = h.y - 7 - ph * (26 + lv * 6);
    ctx.globalAlpha = (1 - ph) * (.30 + lv * .09);
    ctx.fillStyle = i % 2 ? '#ff9a64' : '#ff4a3a';
    ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
  ctx.restore();
}

function drawHero() {
  const h = hero; shadow(h.x, h.y, 10);
  if (!over && h.st !== 'down') drawFireAura(h);
  h.shieldFlash = Math.max(0, (h.shieldFlash || 0) - 1 / 60);
  if (window.ROGUE && ROGUE.shieldReady && ROGUE.shieldReady()) {
    const pulse = .72 + .18 * Math.sin(performance.now() / 230);
    ctx.save(); ctx.globalAlpha = pulse; ctx.strokeStyle = '#d9b968'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(h.x, h.y - 13, 15, 20, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,236,171,.68)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(h.x, h.y - 13, 12, 17, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (h.shieldFlash > 0) { ctx.save(); ctx.globalAlpha = h.shieldFlash / .22; ctx.fillStyle = '#ffe79b'; ctx.beginPath(); ctx.arc(h.x, h.y - 15, 17, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  if (charging) drawChargeAura(h);   // 蓄力聚气（白色气焰）
  if (h.inv > 0 && h.inv < 2 && h.st !== 'roll' && h.st !== 'down' && Math.floor(h.inv * 20) % 2) return;
  drawChar('hero', heroFrame(h), h.x, h.y - (h.z || 0), h.f < 0);
}
function drawZ(z) {
  ch2Telegraph(z);
  if (z.T.boss) { Boss.draw(z); drawHalberdBleedDots(z, z.y - 68); if (z.poisonT > 0) { ctx.fillStyle = '#8fd16a'; ctx.fillRect(z.x - 1, z.y - 64, 3, 3); }
    if (z.celebrating) drawCheer(z); return; }
  if (z.T.chapterBoss) {
    shadow(z.x, z.y, 16);
    const recoil = 0;
    drawChar(z.sprite, zFrame(z), z.x + recoil, z.y - (z.z || 0), z.f < 0, 1, z.flash > 0, z.sc || 1, !!z.dark);
    if (window.BOSS_BLOCK) BOSS_BLOCK.draw(z);
    return;   // 第二章首领的血条和名字统一画在屏幕上方（ZJ.hud）
    drawHalberdBleedDots(z, z.y - 58);
    const w = 34, y = z.y - 49;
    ctx.fillStyle = '#211510'; ctx.fillRect(z.x - w / 2, y, w, 4);
    ctx.fillStyle = '#c93420'; ctx.fillRect(z.x - w / 2 + 1, y + 1, (w - 2) * Math.max(0, z.hp / z.T.hp), 2);
    ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 2; ctx.strokeStyle = '#2a160f'; ctx.fillStyle = '#ffe4ad';
    ctx.strokeText(z.T.name, z.x, y - 3); ctx.fillText(z.T.name, z.x, y - 3); ctx.textAlign = 'left';
    return;
  }
  shadow(z.x, z.y, 10);
  const a = z.st === 'gone' ? Math.max(0, 1 - z.t * 1.2) * (Math.floor(z.t * 12) % 2 ? .4 : 1) : 1;
  const hop = z.celebrating ? Math.abs(Math.sin(z.celebrateT * 7)) * 2.5 : 0;
  drawChar(z.sprite || z.type, zFrame(z), z.x, z.y - (z.z || 0) - hop, z.f < 0, a, z.flash > 0, z.sc || 1, !!z.dark);
  if (z.celebrating) drawCheer(z);
  if (z.dead || z.air || z.st === 'land') return;
  drawHalberdBleedDots(z, z.y - 40);
  const top = z.y - 34;
  if (z.st === 'sleep') {
    const bob = Math.sin(performance.now() / 300) * 2;
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 2;
    ctx.strokeStyle = '#34231b'; ctx.fillStyle = '#fff0a8';
    ctx.strokeText('Z', z.x + 9, z.y - 20 + bob); ctx.fillText('Z', z.x + 9, z.y - 20 + bob);
    ctx.textAlign = 'left'; return;
  }
  if (z.st === 'wake') {
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 3;
    ctx.strokeStyle = '#34231b'; ctx.fillStyle = '#ff4a32';
    ctx.strokeText('!', z.x, top - 4); ctx.fillText('!', z.x, top - 4); ctx.textAlign = 'left';
  }
  if (z.daze > 0) {   // 头顶转圈的小黄星
    const t = performance.now() / 260;
    for (let k = 0; k < 3; k++) {
      const a = t + k * 2.094, sx = z.x + Math.cos(a) * 7, sy = top - 6 + Math.sin(a) * 2;
      ctx.fillStyle = '#3a2410'; ctx.fillRect(sx - 2, sy - 2, 4, 4); ctx.fillStyle = '#ffd84a'; ctx.fillRect(sx - 1.5, sy - .5, 3, 1); ctx.fillRect(sx - .5, sy - 1.5, 1, 3);
    }
  }
  if (z.poisonT > 0) { ctx.fillStyle = '#8fd16a'; ctx.fillRect(z.x - 1, top - 5, 3, 3); ctx.fillStyle = '#4c8a43'; ctx.fillRect(z.x + 3, top - 7, 2, 2); }
  if (z.st === 'wind' && !z.T.ranged) { ctx.fillStyle = '#e03a2a'; ctx.fillRect(z.x - 1, top - 10, 3, 6); ctx.fillRect(z.x - 1, top - 2.5, 3, 2); }
  const barW = z.T.elite ? 26 : 18;
  const barY = top;
  ctx.fillStyle = '#18101e'; ctx.fillRect(z.x - barW / 2, barY, barW, 3); ctx.fillStyle = z.T.elite ? '#e04a2a' : z.T.heavy ? '#e0a030' : '#7ad06a'; ctx.fillRect(z.x - barW / 2 + 1, barY + 1, (barW - 2) * z.hp / z.T.hp, 1);
}
function drawCheer(z) {
  const t = z.celebrateT || 0, bob = Math.abs(Math.sin(t * 7)) * 2.5, y = z.y - 20 - bob;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const phase = (t * 2.8 + i / 3) % 1, x = z.x + (i - 1) * 9 + Math.sin(t * 5 + i) * 2;
    const sy = y - 12 - phase * 14;
    ctx.globalAlpha = 1 - phase;
    ctx.fillStyle = i % 2 ? '#f5c75e' : '#e76a3b';
    ctx.fillRect(x, sy, 2, 3);
  }
  ctx.restore();
}

// 画布按实际显示尺寸 × 设备像素比绘制（手机上更清晰），窗口/横竖屏变化时重新适配
let DPR = 1;
function fit() {
  const vv = window.visualViewport, w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit();
// 手机：禁止双击放大、双指缩放、页面拖动
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
let last = performance.now();
function canPauseGame() {
  if (over || won || result || !hero || hero.hp <= 0) return false;
  if (window.TITLE && TITLE.blocks && TITLE.blocks()) return false;
  if (window.ROOM && ROOM.active && ROOM.active()) return false;
  if (window.CHAPTER2_INTRO && CHAPTER2_INTRO.active && CHAPTER2_INTRO.active()) return false;
  if (window.ROGUE && ROGUE.blocks && ROGUE.blocks()) return false;
  if (window.XIAOCHANG && XIAOCHANG.blocks && XIAOCHANG.blocks()) return false;
  if (chapter2Run && chapter2Run.mode !== 'fight') return false;
  return true;
}
function clearPauseInputs() {
  for (const k in key) delete key[k];
  joy = null; jk.style.transform = '';
  pressAtk = false; pressRoll = false; attackPointer = null;
  if (hero) hero.q = 0;
  cancelCharge();
}
function restartPausedGame() {
  if (window.XIAOCHANG && XIAOCHANG.active()) {
    const r = XIAOCHANG.state(); if (r) XIAOCHANG.start({ chapter: r.chapter, floor: r.floor, wish: r.wish });
  } else if (chapter2Run) prepareChapter2Run(false);
  else reset();
}
function returnFromPausedGame(toHome = false) {
  const training = !!(window.XIAOCHANG && XIAOCHANG.active());
  const run = training && XIAOCHANG.state();
  const chapter = run ? run.chapter : chapter2Run ? 2 : 1;
  const view = training ? 'xiaochang' : 'campaign';
  if (toHome) { if (window.TITLE && TITLE.show) TITLE.show(); else reset(); return; }
  reset();
  if (window.ROGUE) ROGUE.reset();
  if (window.TITLE && TITLE.openPreparation) TITLE.openPreparation({ chapter, view });
}
window.GAME_PAUSE = {
  canPause: canPauseGame,
  clearInput: clearPauseInputs,
  restart: restartPausedGame,
  returnPreparation: () => returnFromPausedGame(false),
  returnHome: () => returnFromPausedGame(true),
};
function loop(t) { const dt = Math.min(.033, (t - last) / 1000); last = t; update(dt); draw(); requestAnimationFrame(loop); }
if (window.ROGUE) ROGUE.reset(); reset(); ui(); requestAnimationFrame(loop);
</script></body></html>
