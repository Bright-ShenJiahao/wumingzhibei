    const s = ac.createBufferSource(); s.buffer = southernDrum;
    s.playbackRate.value = (edge ? 1.16 : 1) * (1 + (Math.random() - .5) * .025);
    const filter = ac.createBiquadFilter(); filter.type = edge ? 'highpass' : 'lowpass';
    filter.frequency.value = edge ? 140 : 2200;
    const g = ac.createGain(); g.gain.value = vel * (edge ? .58 : 1.15);
    s.connect(filter).connect(g).connect(dest);
    s.start(t); s.stop(t + southernDrum.duration + .05);
  }

  // 战鼓：鼓皮的下坠正弦 + 鼓槌的闷响；重击再补一层很低的下潜（余震）
  function drum(t, kind, vel, dest) {
    if (!(vel > 0)) return;
    if (kind === 'snare') {   // 鼓边／脆击
      const g = ac.createGain(); g.connect(dest);
      const s = noiseSrc(), f = ac.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .9;
      s.connect(f).connect(g);
      g.gain.setValueAtTime(vel * .9, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .13);
      s.start(t, Math.random()); s.stop(t + .16);
      return;
    }
    const g = ac.createGain(); g.connect(dest);
    const o = osc('sine', kind === 'tom' ? 250 : 150, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'tom' ? 105 : 44, t + (kind === 'tom' ? .26 : .2));
    o.connect(g);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + (kind === 'tom' ? .32 : .46));
    o.start(t); o.stop(t + .55);
    const s = noiseSrc(), lp = ac.createBiquadFilter(), ng = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = kind === 'tom' ? 900 : 420;
    s.connect(lp).connect(ng).connect(dest);
    ng.gain.setValueAtTime(vel * .5, t);
    ng.gain.exponentialRampToValueAtTime(.0001, t + .09);
    s.start(t, Math.random()); s.stop(t + .12);
    if (kind === 'kick' && vel > .45) {
      const o2 = osc('sine', 72, t), g2 = ac.createGain();
      o2.frequency.exponentialRampToValueAtTime(36, t + .5);
      o2.connect(g2).connect(dest);
      g2.gain.setValueAtTime(.0001, t);
      g2.gain.linearRampToValueAtTime(vel * .6, t + .02);
      g2.gain.exponentialRampToValueAtTime(.0001, t + .7);
      o2.start(t); o2.stop(t + .8);
    }
  }

  // 拨弦（古筝/琵琶）：几个倍频同时衰减，低通随音量往下扫，再叠一点指甲拨弦的"咔"
  function pluck(t, midi, vel, dest, dur = .7) {
    if (!(vel > 0)) return;
    const f = m2f(midi);
    const g = ac.createGain(); g.connect(dest);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .7;
    lp.frequency.setValueAtTime(Math.min(9000, f * 9), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(260, f * 1.6), t + .3);
    lp.connect(g);
    for (const [mul, amp, type] of [[1, 1, 'triangle'], [2, .4, 'sine'], [3, .18, 'sine'], [4.02, .1, 'sine']]) {
      const o = osc(type, f * mul, t);
      o.detune.value = (Math.random() - .5) * 7;
      const og = ac.createGain(); og.gain.value = amp;
      o.connect(og).connect(lp); o.start(t); o.stop(t + dur + .1);
    }
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + .005);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const s = noiseSrc(), hp = ac.createBiquadFilter(), ng = ac.createGain();
    hp.type = 'highpass'; hp.frequency.value = 2400;
    s.connect(hp).connect(ng).connect(dest);
    ng.gain.setValueAtTime(vel * .18, t);
    ng.gain.exponentialRampToValueAtTime(.0001, t + .045);
    s.start(t, Math.random()); s.stop(t + .07);
  }

  // 长音（埙/二胡）：缓慢起音 + 颤音 + 气声，长尾音
  function longTone(t, midi, dur, vel, dest) {
    if (!(vel > 0)) return;
    const f = m2f(midi);
    const g = ac.createGain(); g.connect(dest);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = Math.min(3000, f * 5); lp.Q.value = .6; lp.connect(g);
    const vib = ac.createOscillator(); vib.frequency.value = 4.8;
    const vg = ac.createGain(); vg.gain.value = f * .008;
    vib.connect(vg);
    for (const [mul, amp, type] of [[1, .8, 'triangle'], [2, .22, 'sine'], [3, .1, 'sine']]) {
      const o = osc(type, f * mul, t);
      vg.connect(o.frequency);
      const og = ac.createGain(); og.gain.value = amp;
      o.connect(og).connect(lp); o.start(t); o.stop(t + dur + .9);
    }
    vib.start(t); vib.stop(t + dur + .9);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + Math.min(.45, dur * .4));
    g.gain.setValueAtTime(vel, t + dur);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur + .8);
    const s = noiseSrc(), bp = ac.createBiquadFilter(), ng = ac.createGain();
    bp.type = 'bandpass'; bp.frequency.value = f * 3; bp.Q.value = 1.4;
    s.connect(bp).connect(ng).connect(dest);
    ng.gain.setValueAtTime(.0001, t);
    ng.gain.linearRampToValueAtTime(vel * .12, t + .4);
    ng.gain.setValueAtTime(vel * .12, t + dur);
    ng.gain.exponentialRampToValueAtTime(.0001, t + dur + .6);
    s.start(t, Math.random()); s.stop(t + dur + .7);
  }

  // 短促军号/低弦：柔化锯齿泛音，留出攻击音效和对白所在的中高频。
  function warVoice(t, midi, dur, vel, dest, horn = false) {
    const filter = ac.createBiquadFilter(); filter.type = 'lowpass';
    filter.frequency.value = horn ? 1550 : 720; filter.Q.value = .5;
    const g = ac.createGain(); filter.connect(g).connect(dest);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + (horn ? .065 : .025));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    for (const detune of [-5, 5]) {
      const o = osc('triangle', m2f(midi), t);
      o.detune.value = detune;
      o.connect(filter); o.start(t); o.stop(t + dur + .05);
    }
  }

  // ---------- 循环曲 ----------
  function playStep(L, bar, st, t) {
    const T = L.track;
    const dp = T.drums[T.drumArr[bar]];
    if (dp) {
      const c = dp[st];
      if (c && c !== '.') { const d = DRUM[c]; if (d) (T.war ? warDrum : drum)(t, d[0], d[1] * T.lv.drum, L.gain); }
    }
    const ev = T.melMap.get(bar * 16 + st);
    if (ev && (!T.war || bar % 2 === 0 || (T.war > 1 && st === 0))) {
      pluck(t, dn(ev[0]), (ev[1] || .34) * T.lv.pluck, L.gain, ev[2] || (T.war ? 1 : .7));
    }
    if (st === 0 && T.tones && T.tones[bar]) {
      const [d, beats] = T.tones[bar];
      longTone(t, dn(d), beats * 60 / T.bpm, T.lv.tone, L.gain);
    }
    if (T.war) {
      const root = [0, 0, 3, 2][Math.floor(bar / 4) % 4];
      if (st === 0 || (T.war > 1 && st === 8)) {
        warVoice(t, dn(root), .33, T.war > 1 ? .075 : .035, L.gain);
      }
      if (T.war > 1 && bar % 8 === 0 && (st === 0 || st === 10)) {
        warVoice(t, dn([5, 8, 7][st === 0 ? 0 : st === 6 ? 1 : 2]), .42, .045, L.gain, true);
      }
    }
  }

  function newLayer(name, previous) {
    const T = TRACKS[name];
    const g = ac.createGain(); g.gain.value = .0001; g.connect(out);
    const L = { name, track: T, gain: g, step: 0, time: ac.currentTime + .12, spb: 60 / T.bpm / 4, nodes: [] };
    if (previous && T.sync && T.sync === previous.track.sync && T.bpm === previous.track.bpm) {
      L.step = previous.step; L.time = previous.time;
    }
    if (T.drone) {   // 低音持续音，跟着本曲一起淡入淡出
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = m2f(T.drone.midi);
      const dg = ac.createGain(); dg.gain.value = T.drone.level;
      const lfo = ac.createOscillator(); lfo.frequency.value = .17;
      const lg = ac.createGain(); lg.gain.value = T.drone.level * .45;
      lfo.connect(lg).connect(dg.gain);
      o.connect(dg).connect(g);
      o.start(); lfo.start();
      L.nodes.push(o, lfo);
    }
    layers.push(L);
    return L;
  }

  function stopLayer(L, dur) {
    if (!L || L.stopping) return;
    L.stopping = true;
    const t = ac.currentTime;
    L.gain.gain.cancelScheduledValues(t);
    L.gain.gain.setValueAtTime(Math.max(.0001, L.gain.gain.value), t);
    L.gain.gain.linearRampToValueAtTime(.0001, t + dur);
    setTimeout(() => {
      for (const n of L.nodes) { try { n.stop(); } catch (e) {} }
      try { L.gain.disconnect(); } catch (e) {}
      layers = layers.filter(x => x !== L);
    }, (dur + .25) * 1000);
  }

  function pump() {
    if (!ac || ac.state !== 'running') return;
    menuPump();
    const ahead = ac.currentTime + LOOK;
    for (const L of layers.slice()) {
      if (L.time < ac.currentTime - .2) L.time = ac.currentTime + .05;   // 被系统休眠/切后台后别补一堆音
      const total = L.track.bars * 16;
      while (L.time < ahead) {
        const s = L.step % total;
        playStep(L, Math.floor(s / 16), s % 16, L.time);
        L.step++; L.time += L.spb;
      }
    }
  }

  // ---------- 胜利 / 失败（一次性） ----------
  const JINGLE_LEN = { victory: 4.2, defeat: 4.8 };
  const JINGLES = {
    // 胜利：五声上行号角 + 鼓，落在明亮的宫和弦上
    victory(g, t) {
      [[0, 57], [.2, 64], [.4, 69], [.6, 72], [.8, 76], [1.0, 81]].forEach(([dt, m]) => {
        pluck(t + dt, m, .4, g, .9); drum(t + dt, 'kick', .42, g);
      });
      drum(t + 1.15, 'snare', .3, g);
      drum(t + 1.18, 'snare', .34, g);
      pluck(t + 1.3, 48, .28, g, 1.2);
      [60, 64, 67, 72].forEach(m => pluck(t + 1.3, m, .22, g, 2.3));
      drum(t + 1.3, 'kick', .8, g);
      longTone(t + 1.35, 72, 1.5, .2, g);
      drum(t + 2.25, 'kick', .3, g);
    },
    // 失败：低沉下行 + 一声哀凉的埙
    defeat(g, t) {
      drum(t, 'kick', .6, g);
      [[0, 69], [.45, 67], [.95, 64], [1.5, 62], [2.05, 60], [2.65, 57]].forEach(([dt, m], i) => {
        pluck(t + dt, m, .32 - i * .015, g, 1.2);
      });
      drum(t + 2.65, 'kick', .5, g);
      longTone(t + .9, 57, 2.4, .2, g);
      longTone(t + .9, 45, 2.4, .12, g);
      drum(t + 3.55, 'kick', .32, g);
    },
  };

  function playJingle(name) {
    stopJingle(.2);
    const g = ac.createGain(); g.gain.value = 1; g.connect(out);
    const t0 = ac.currentTime + .06;
    JINGLES[name](g, t0);
    jingle = g;
    const len = JINGLE_LEN[name] * 1000;
    setTimeout(() => { if (jingle === g) { jingle = null; try { g.disconnect(); } catch (e) {} } }, len);
  }
  function stopJingle(dur) {
    const g = jingle; if (!g) return;
    jingle = null;
    const t = ac.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(.0001, t + dur);
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, (dur + .1) * 1000);
  }

  // ---------- 状态 ----------
  // 读 game.js 的全局变量（同一个 <script> 里，let 声明的可以直接读；开局前是 TDZ，用 try 兜住）
  function readState() {
    try {
      // 主界面、整军备战、校场页：放《灯下》（js/menu_music.js）
      if (window.MENU_MUSIC && window.TITLE && TITLE.mode && ['title', 'chapter'].includes(TITLE.mode())) return 'menu';
      // 第二章素材加载中：直接进第二章行军鼓乐（此时 chapter2Run 还没建好，不能落到第一章曲子）
      if (window.CHAPTER_LOADING === 2) return 'warField';
      if (typeof won !== 'undefined' && won) return 'victory';
      if (typeof over !== 'undefined' && over) return 'defeat';
      if (typeof chapter2Run !== 'undefined' && chapter2Run && !(window.TITLE && TITLE.blocks())) {
        if (window.CHAPTER2_INTRO && CHAPTER2_INTRO.active()) return 'warField';
        const alive = typeof zs !== 'undefined' && zs ? zs.filter(z => z && !z.dead) : [];
        if (alive.some(z => z.T && (z.T.boss || z.T.chapterBoss))) return 'warBoss';
        if (chapter2Run.mode === 'fight' && alive.length) combatHoldUntil = performance.now() + 2400;
        if (['intro', 'choice', 'preview', 'victory', 'complete'].includes(chapter2Run.mode)) return 'warField';
        return performance.now() < combatHoldUntil ? 'warBattle' : 'warField';
      }
      // 第二章的校场也用第二章鼓乐
      const xc = window.XIAOCHANG && XIAOCHANG.active() && XIAOCHANG.state();
      if (xc && xc.chapter === 2) {
        const alive = typeof zs !== 'undefined' && zs ? zs.filter(z => z && !z.dead) : [];
        if (alive.some(z => z.T && (z.T.boss || z.T.chapterBoss))) return 'warBoss';
        return alive.length ? 'warBattle' : 'warField';
      }
      if (typeof zs !== 'undefined' && zs && zs.some && zs.some(z => z && z.T && z.T.boss && !z.dead)) return 'boss';
      if (typeof lockR !== 'undefined' && lockR < Infinity) return 'battle';
    } catch (e) {}
    return 'village';
  }

  // ---------- 菜单轻音乐《灯下》：逐小节排程，和战斗音乐交叉淡入淡出 ----------
  let menuGain = null, menuBus = null, menuOn = false, menuBar = 0, menuNext = 0;
  const MENU_LEVEL = 1.15;
  function menuStart() {
    if (!window.MENU_MUSIC) return;
    if (!menuGain) { menuGain = ac.createGain(); menuGain.gain.value = .0001; menuGain.connect(out); menuBus = MENU_MUSIC.makeBus(ac, menuGain); }
    const t = ac.currentTime;
    menuGain.gain.cancelScheduledValues(t); menuGain.gain.setValueAtTime(Math.max(.0001, menuGain.gain.value), t);
    menuGain.gain.linearRampToValueAtTime(MENU_LEVEL, t + XFADE);
    if (!menuOn) { menuOn = true; menuBar = 0; menuNext = t + .1; }
  }
  function menuStop() {
    if (!menuGain || !menuOn) return;
    menuOn = false;
    const t = ac.currentTime;
    menuGain.gain.cancelScheduledValues(t); menuGain.gain.setValueAtTime(Math.max(.0001, menuGain.gain.value), t);
    menuGain.gain.linearRampToValueAtTime(.0001, t + XFADE);
  }
  function menuPump() {
    if (!menuOn) return;
    if (menuNext < ac.currentTime - .2) menuNext = ac.currentTime + .05;   // 切后台回来不补放
    while (menuNext < ac.currentTime + 1.2) {
      MENU_MUSIC.render(ac, null, menuNext, menuBar, 1, menuBus);
      MENU_MUSIC.vinyl(ac, menuBus, menuNext, MENU_MUSIC.BAR + .05);
      menuNext += MENU_MUSIC.BAR; menuBar = (menuBar + 1) % MENU_MUSIC.BARS;
    }
  }

  function applyState(st) {
    const prev = state; state = st;
    if (st === 'menu') {
      stopJingle(.4);
      layers.filter(L => !L.stopping).forEach(L => stopLayer(L, XFADE));
      menuStart();
      return;
    }
    menuStop();
    if (st === 'victory' || st === 'defeat') {
      if (layers.length) { layers.slice().forEach(L => stopLayer(L, .6)); }
      if (prev !== st) playJingle(st);
      return;
    }
    stopJingle(.4);
    const cur = layers[layers.length - 1];
    if (cur && cur.name === st && !cur.stopping) return;
    layers.filter(L => !L.stopping).forEach(L => stopLayer(L, XFADE));
    const L = newLayer(st, cur);
    const t = ac.currentTime;
    L.gain.gain.setValueAtTime(.0001, t);
    L.gain.gain.linearRampToValueAtTime(1, t + XFADE);
  }

  function applyVolume() {
    if (!out) return;
    const t = ac.currentTime;
    out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(out.gain.value, t);
    out.gain.linearRampToValueAtTime(muted ? .0001 : OUT_LEVEL * (dialogueQuiet ? .45 : 1) * (pauseDucked ? .3 : 1), t + .25);
  }

  // 系统有时会把音频上下文挂起（切后台、来电），在手势或轮询时顺手恢复
  function resumeAudio() { if (ac && ac.state === 'suspended' && !document.hidden) { try { ac.resume(); } catch (e) {} } }
  function poll() {
    if (!started || !ac) return;
    resumeAudio();
    const st = readState();
    if (st !== state) applyState(st);
    const m = !!(window.SFX && typeof SFX.isMuted === 'function' && SFX.isMuted());
    const quiet = !!(window.CHAPTER2_INTRO && CHAPTER2_INTRO.active());
    if (m !== muted || quiet !== dialogueQuiet) { muted = m; dialogueQuiet = quiet; applyVolume(); }
  }

  // ---------- 启动（浏览器要求先有用户操作） ----------
  function boot() {
    if (started) return;
    started = true;
    try {
      ac = new AC();
      loadSouthernDrum();
      out = ac.createGain();
      out.gain.value = .0001;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .2;
      // 手机喇叭放不出低频战鼓，给整体加一点高频，旋律和拨弦才听得见
      const hs = ac.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 2400; hs.gain.value = 4.5;
      out.connect(hs).connect(comp).connect(ac.destination);
      if (ac.state === 'suspended') ac.resume();
      muted = !!(window.SFX && typeof SFX.isMuted === 'function' && SFX.isMuted());
      out.gain.linearRampToValueAtTime(muted ? .0001 : OUT_LEVEL, ac.currentTime + 1.2);
      state = null;
      applyState(readState());
      schedT = setInterval(pump, 40);
      pollT = setInterval(poll, 300);
      document.addEventListener('visibilitychange', onVisible);
    } catch (e) {
      started = false;
      console.warn('[BGM] 启动失败：', e);
    }
  }

  // 切到后台就挂起，回来时把排程时间对齐，避免一次补放很多音
  function onVisible() {
    if (!ac) return;
    if (document.hidden) { try { ac.suspend(); } catch (e) {} return; }
    try { ac.resume(); } catch (e) {}
    const now = ac.currentTime;
    for (const L of layers) if (L.time < now) L.time = now + .1;
  }

  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, boot, { capture: true, passive: true }));
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, resumeAudio, { capture: true, passive: true }));

  // 供调试/其它模块使用（不改 game.js）
  window.BGM = {
    start: boot,
    state: () => state,
    isMuted: () => muted,
    setPauseDucked(value) { pauseDucked = !!value; applyVolume(); },
  };
})();

  #wzbBoard td.num{text-align:right;color:#ffd86e;font-variant-numeric:tabular-nums}
  #wzbBoard tr.me td{background:rgba(255,216,110,.12)}
  #wzbBoard .empty{padding:26px 6px;text-align:center;color:#a08d70;line-height:1.7}
  #wzbBoard .foot{padding:8px 14px 12px;color:#8d7a5e;font-size:12px;text-align:center}
  #wzbBoard .rowName{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:520px){
    #wzbBoard .panel{width:96vw}
    #wzbBoard table{font-size:13px}
    #wzbBoard .rowName{max-width:92px}
  }`;

  function fmtTime(s) {
    const m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return m + ':' + String(ss).padStart(2, '0');
  }
  function fmtDate(ms) {
    const d = new Date(ms);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function ensure() {
    if (wrap) return;
    if (!document.getElementById('wzbBoardCss')) {
      const st = document.createElement('style'); st.id = 'wzbBoardCss'; st.textContent = CSS;
      document.head.appendChild(st);
    }
    wrap = document.createElement('div');
    wrap.id = 'wzbBoard';
    wrap.innerHTML = `
      <div class="panel">
        <div class="hd"><h2>英雄榜</h2><button class="x" type="button">关闭</button></div>
        <div class="tabs"><button type="button" class="on" style="cursor:default">积分榜</button></div>
        <div class="body"></div>
        <div class="foot">评分 = 击杀×10 + 通关区域数×100 + 时间分 + 无伤分 · 共 6 个区域</div>
      </div>`;
    document.body.appendChild(wrap);
    body = wrap.querySelector('.body');
    wrap.querySelector('.x').addEventListener('click', close);
    wrap.addEventListener('pointerdown', e => e.stopPropagation());
    wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) close(); });
  }

  function render() {
    if (!body) return;
    if (loading) { body.innerHTML = '<div class="empty">正在读取榜单……</div>'; return; }
    if (err) { body.innerHTML = '<div class="empty">榜单暂时连不上<br><span style="font-size:12px">' + err + '</span></div>'; return; }
    const list = (data && data.list) || [];
    if (!list.length) {
      body.innerHTML = '<div class="empty">还没有人上榜<br>打一局就能留下名字</div>';
      return;
    }
    const rows = list.map((r, i) => {
      const cl = r.cleared == null ? '—' : String(r.cleared);
      return `<tr class="${r.me ? 'me' : ''}">
        <td style="width:26px;color:#b79c72">${i + 1}</td>
        <td class="rowName" title="${esc(r.name)}">${esc(r.name)}</td>
        <td class="num" style="font-size:16px">${r.score == null ? '-' : r.score}</td>
        <td class="num">${r.kills} 杀</td>
        <td class="num">${cl}</td>
        <td class="num">${fmtTime(r.t)}</td>
        <td style="text-align:right;color:#8d7a5e;font-size:12px">${fmtDate(r.at)}</td>
        <td style="text-align:right;font-size:12px;color:${r.diff === 'hard' ? '#e0703a' : '#8d7a5e'}">${r.diff === 'hard' ? '困难' : '简单'}</td>
      </tr>`;
    }).join('');
    body.innerHTML = `<table>
      <thead><tr><th>#</th><th>玩家</th><th style="text-align:right">评分</th>
      <th style="text-align:right">击杀</th><th style="text-align:right">通关区域数</th>
      <th style="text-align:right">用时</th><th style="text-align:right">日期</th><th style="text-align:right">难度</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function load() {
    if (loading) return;
    loading = true; err = null; render();
    fetch('/api/scores', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(j => { if (!j || !j.ok) throw new Error('接口返回异常'); data = j; })
      .catch(e => { err = e && e.message ? e.message : '网络错误'; })
      .then(() => { loading = false; render(); });
  }

  function open() {
    ensure(); load();
    wrap.classList.add('on');
  }
  function close() { if (wrap) wrap.classList.remove('on'); }
  function isOpen() { return !!(wrap && wrap.classList.contains('on')); }

  // 通关后提交成绩；失败不打扰玩家
  function submit(rec) {
    const payload = { name: rec && rec.name, kills: rec && rec.kills, t: rec && rec.t,
      zone: rec && rec.zone, win: !!(rec && rec.win), hits: rec && rec.hits, bonus: rec && rec.bonus, diff: rec && rec.diff, revives: rec && rec.revives };   // 关卡/通关/受击都要传，否则服务端算不出一样的评分
    return fetch('/api/scores', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(r => r.json().catch(() => ({ ok: false })))
      .then(j => { if (j && j.ok && typeof toast === 'function') toast('成绩已上传 · 首页可看英雄榜'); return j; })
      .catch(() => { if (typeof toast === 'function') toast('成绩上传失败（不影响游戏）'); return { ok: false }; });
  }

  window.BOARD = { open, close, submit, isOpen, reload: load };
})();

// 序章 Boss：黄巾流寇·管亥
// 第一阶段（马上）：骑马冲锋 / 马踏飞燕 / 马上横劈，75% 血时叫两个喽啰
// 转阶段（一半血）：摔下马，马逃走，怒吼（无敌）
// 第二阶段（步战）：重劈（地面冲击波）/ 头顶转戟（追人，转完头晕）/ 突刺；打太多下会踉跄；25% 以下狂暴
// 依赖 game.js 里的全局：hero, zs, cam, M, viewW, dmgHero, launch, sfx, say, kills, drawChar, shadow, ctx
const Boss = (() => {
  const HP = 80;
  let fx = [];          // 冲击波、预警等
  let horse = null;     // 摔下马后逃走的马
  const T = { name: '管亥', hp: HP, heavy: true, boss: true, w: 18 };
  const CHARGE = .5;   // 冲锋距离 = 屏幕宽度 × 0.5

  // 天气：只在 Boss 战出现，进场的瞬间 50% 概率下雨/下雪/起风
  let WX = null;
  const WX_ID = { rain: '下雨了……地面很滑', snow: '下雪了……手脚都变慢了', wind: '起风了……石子会被吹偏' };
  function wxMove() { return WX === 'rain' ? .9 : WX === 'snow' ? .88 : 1; }
  function wxAspd() { return WX === 'snow' ? 1.1 : 1; }
  function wxProj() { return WX === 'wind' ? .85 : 1; }

  function start(rightEdge) {
    WX = window.XIAOCHANG && XIAOCHANG.active() ? null : Math.random() < .5 ? ['rain', 'snow', 'wind'][Math.floor(Math.random() * 3)] : null;
    if (WX && WX_ID[WX]) setTimeout(() => say(WX_ID[WX], 3), 500);
    if (typeof arenaL !== 'undefined') arenaL = rightEdge - (typeof viewW === 'function' ? viewW() : 530) * 1.0;   // 决斗场：1 个屏幕宽
    const z = { type: 'guanhai_horse', T, x: rightEdge + 60, y: (M.top + M.bot) / 2, f: -1, hp: HP, st: 'intro', t: 0, phase: 1,
      flash: 0, vx: 0, poise: 0, cd: 1.2, called: false, slot: 0, z: 0 };
    zs.push(z); fx = []; horse = null;
    sfx('land', z.x);
    return z;
  }
  const set = (z, st) => { z.st = st; z.t = 0; if (st !== 'leap') z.z = 0; };   // 切状态时把离地高度清零，防止卡在半空
  // 配音（art/voice/guanhai_*.mp3）。只保留 5 句台词：登场 / 喊人 / 落马 / 怒吼 / 战败。
  // 攻击时的吼声（chop / thrust / spin / stagger）已按用户要求去掉：Boss 战一打久了就太吵，而且会互相叠音。
  const vo = (n, p = 1) => { if (window.SFX && Math.random() < p) SFX.voice('guanhai_' + n); };
  const view = () => window.XIAOCHANG && XIAOCHANG.active() ? [0, M.W] : [cam.x, cam.x + viewW()];
  function moveTo(z, tx, ty, sp, dt) {
    sp *= wxMove();
    if (z.halberdBleed > 0 && gameT < z.halberdBleedUntil) sp *= .9;   // 长戟裂伤减速
    const dx = tx - z.x, dy = ty - z.y, l = Math.hypot(dx, dy);
    if (l < 2) return true;
    const k = Math.min(1, sp * dt * (window.GEAR ? GEAR.enemyMove(z) : 1) / l); z.x += dx * k; z.y += dy * .7 * k;
    z.y = Math.max(M.top, Math.min(M.bot, z.y));
    if (Math.abs(dx) > 2) z.f = Math.sign(dx);
    return false;
  }
  function heroIn(x, y, rx, ry) { return Math.abs(hero.x - x) < rx && Math.abs(hero.y - y) < ry; }

  // ---------- 受击 ----------
  function hit(z, dmg, dir, ranged, traits = {}) {
  if (ranged && window.BOSS_BLOCK && BOSS_BLOCK.isBlocking(z, dir)) { BOSS_BLOCK.effect(z); return 'blocked'; }
    if (z.dead || z.st === 'fall' || z.st === 'roar' || z.st === 'intro') return;
    // 去捡戟的路上无敌（飞在空中），只溅火星表示"打不动"，避免玩家以为没打中
    if (z.spear && (z.st === 'leap' || z.st === 'pickup')) {
      for (let i = 0; i < 5; i++) {
        const life = rnd(.08, .2);
        propFx.push({ x: z.x + rnd(-8, 8), y: z.y - rnd(14, 34), vx: rnd(-70, 70) - dir * 30, vy: rnd(-90, -10),
          w: rnd(1, 2), h: rnd(1, 2), life, max: life, c: Math.random() < .5 ? '#fffbe6' : '#ffd88a' });
      }
      return;
    }
    // 掷戟后的空手窗口：只吃一半伤害（完全不能攻击，是玩家该抓的破绽）
    if (z.spear) dmg *= .5;   // 家伙不在手上（掷出去了）就一直只吃一半伤害
    if (z.daze > 0) dmg *= 1.5;   // 被石子晕住的首领同样吃 1.5 倍伤害
    z.hp -= dmg; z.flash = .1; freeze = .04; shake = .08;
    hero.lastHit = gameT; hero.lastHitC = hero.atk ? hero.atk.c : hero.lastShotC;
    if (z.phase === 2) {
      z.poise += dmg;
      // 扑过去捡戟的过程不被打断（否则破绽窗口会无限延长），但伤害照吃
      const busy = ['chop_a', 'chop_b', 'spin', 'thrust_a', 'thrust_b', 'leap', 'pickup'].includes(z.st);
      if (z.poise >= 9 && !busy) { z.poise = 0; set(z, 'stagger'); }
      else if (z.st === 'walk' || z.st === 'idle') z.x += dir * 3;
    }
    if (z.phase === 1 && !z.called && z.hp <= HP * .75) {
      z.called = true; say('管亥：「小的们，给我上！」', 2.5); vo('call');
      spawn('grunt', cam.x + 8, M.top + 20); spawn('grunt', cam.x + viewW() - 8, M.bot - 10);
    }
    if (z.phase === 1 && z.hp <= HP / 2) {   // 摔下马
      z.hp = HP / 2; set(z, 'fall'); z.vx = -z.f * 60; fx = fx.filter(e => e.k !== 'lane' && e.k !== 'ring');
      horse = { x: z.x + z.f * 10, y: z.y, f: z.f, t: 0 };
      say('管亥：「啊——！畜生！」', 2); vo('fall'); sfx('enemyDown', z.x); shake = .3;
    }
    if (z.hp <= 0) {
      z.hp = 0; z.dead = 1; kills++; set(z, 'kneel'); fx = [];
      say('管亥：「这……这小子是什么人……」', 3.5); vo('defeat'); sfx('enemyDown', z.x); shake = .3;
      // 结尾：村民道谢 → 曹军的马蹄声，接第二章
      setTimeout(() => say('村民：「是那个穿着古怪衣裳的后生……他一个人把贼赶跑了！」', 3), 3600);
      setTimeout(() => say('远处传来马蹄声，一面写着「曹」字的大旗正朝村子而来……', 3), 6600);
    }
    if (ranged) {
      if (window.BOSS_BLOCK) BOSS_BLOCK.tryStun(z, traits);
      if (window.BOSS_BLOCK) BOSS_BLOCK.recordRanged(z, dir);
    }
  }

  // ---------- 行为 ----------
  function update(z, dt) {
    z.moveSlowT = Math.max(0, (z.moveSlowT || 0) - dt); z.attackSlowT = Math.max(0, (z.attackSlowT || 0) - dt);
    const actionDt = dt * (window.GEAR ? GEAR.enemyAttack(z) : (z.attackSlowT > 0 ? .9 : 1));
    z.t += actionDt; z.flash = Math.max(0, z.flash - dt); z.cd -= actionDt;
    if (z.phase === 2) { z.dashCd = (z.dashCd || 0) - actionDt; z.throwCd = (z.throwCd || 0) - actionDt; }
    if (z.stun > 0) { z.stun = Math.max(0, z.stun - dt); return; }
    if (z.daze > 0) { z.daze = Math.max(0, z.daze - dt); z.stun = Math.max(0, z.stun - dt); return; }
    if (window.BOSS_BLOCK && BOSS_BLOCK.update(z, dt, (o, tx, ty, sp, d2) => moveTo(o, tx, ty, sp, d2), z.phase === 1 ? 55 : 56)) return;
    // 掷出去的长戟：飞 → 落地 → 等他去捡
    if (z.spear && !z.spear.land) {
      const p = z.spear; p.x += p.vx * actionDt;
      if (heroIn(p.x, z.y, 16, 14)) { dmgHero(2, { x: p.x }, 'skill'); p.land = 1; shake = .2; }
      else if (Math.abs(p.x - z.x) > 260) p.land = 1;
      if (p.land) { p.y = z.y; z.pickX = p.x; }
    }
    if (horse) { horse.t += actionDt; horse.x += horse.f * 160 * actionDt; if (horse.t > 2.5) horse = null; }
    if (z.dead) {
      // 跪倒 → 倒地，然后就一直躺着：通关结算时大将要留在场上，不再转 gone 消失
      if (z.st === 'kneel' && z.t > 2.2) set(z, 'down');
      return;
    }
    const [L, Rr] = view();
    const dx = hero.x - z.x, ad = Math.abs(dx), ady = Math.abs(hero.y - z.y);
    if (z.phase === 1) phase1(z, actionDt, dx, ad, ady, L, Rr); else phase2(z, actionDt, dx, ad, ady, L, Rr);
  }

  function phase1(z, dt, dx, ad, ady, L, Rr) {
    const S = z.st;
    if (S === 'intro') {   // 骑马冲进画面 → 勒马嘶鸣 → 开打
      if (z.t < .1) say('马蹄声由远而近……', 2);
      if (moveTo(z, Rr - 70, (M.top + M.bot) / 2, 150, dt) || z.t > 3) { set(z, 'introRear'); sfx('bladeAlert', z.x); }
      return;
    }
    if (S === 'introRear') { if (z.t > 1.1) { say('管亥：「北海城都差点被老子踏平——一个小村子，还敢挡路？」', 4.8); window.SFX && SFX.voice('guanhai_intro'); set(z, 'idle'); z.cd = .8; } return; }
    if (S === 'idle') {
      z.f = Math.sign(dx) || z.f;
      // 慢慢靠近主角但保持一点距离
      if (ad > 90) moveTo(z, hero.x - z.f * 70, hero.y, 55, dt); else if (ad < 45) moveTo(z, hero.x - z.f * 80, z.y, 50, dt);
      if (z.cd <= 0) {
        const r = Math.random();
        if (ad < 70 && ady < 16 && r < .55) set(z, 'sweep_a');
        else if (r < .78) { set(z, 'charge_go'); z.side = z.x < (L + Rr) / 2 ? -1 : 1; }
        else { set(z, 'leap_prep'); z.tx = hero.x; z.ty = hero.y; fx.push({ k: 'ring', x: z.tx, y: z.ty, t: 0, T: 1.3 }); sfx('bladeAlert', z.x); }
      }
      return;
    }
    // 骑马冲锋
    if (S === 'charge_go') {   // 退开一段距离，让主角落在冲锋路线中间
      const dist = viewW() * CHARGE, tx = Math.max(L + 40, Math.min(Rr - 40, hero.x + z.side * dist * .55));
      if (moveTo(z, tx, hero.y, 170, dt) || z.t > 2.2) {
        set(z, 'charge_prep'); z.f = Math.sign(hero.x - z.x) || -z.side; z.cx0 = z.x; z.cdist = dist;
        fx.push({ k: 'lane', y: z.y, x0: z.x, x1: z.x + z.f * dist, t: 0, T: .85 }); sfx('bladeAlert', z.x);
      }
      return;
    }
    if (S === 'charge_prep') { if (z.t > .85) { set(z, 'charge'); sfx('enemySwing', z.x); } return; }
    if (S === 'charge') {
      z.x += z.f * 300 * dt;
      if (z.t % .18 < dt) sfx('land', z.x);
      if (heroIn(z.x + z.f * 20, z.y, 32, 11)) dmgHero(2, { x: z.x - z.f * 30 }, 'skill');   // 冲锋：戟尖约 50
      if (Math.abs(z.x - z.cx0) >= z.cdist || (z.f > 0 && z.x > Rr - 30) || (z.f < 0 && z.x < L + 30)) { set(z, 'tired'); }
      return;
    }
    if (S === 'tired') { if (z.t > 1.5) { set(z, 'idle'); z.cd = 1; } return; }
    // 马踏飞燕
    if (S === 'leap_prep') { z.f = Math.sign(z.tx - z.x) || z.f; if (z.t > .6) { set(z, 'leap'); z.x0 = z.x; z.y0 = z.y; } return; }
    if (S === 'leap') {
      const p = Math.min(1, z.t / .7);
      z.x = z.x0 + (z.tx - z.x0) * p; z.y = z.y0 + (z.ty - z.y0) * p; z.z = Math.sin(p * Math.PI) * 70;
      if (p >= 1) {
        z.z = 0; set(z, 'stomp'); shake = .3; sfx('enemyDown', z.x);
        fx.push({ k: 'quake', x: z.x, y: z.y, t: 0, T: .45 });
        if (heroIn(z.x, z.y, 40, 16)) dmgHero(2, { x: z.x }, 'skill');
      }
      return;
    }
    if (S === 'stomp') { if (z.t > 1) { set(z, 'idle'); z.cd = 1.2; } return; }
    // 马上横劈
    if (S === 'sweep_a') { z.f = Math.sign(dx) || z.f; if (z.t > .6) { set(z, 'sweep_b'); sfx('enemySwing', z.x); if (heroIn(z.x + z.f * 36, z.y, 40, 15)) dmgHero(2, z, 'skill'); } return; }   // 马上横扫：戟尖约 75
    if (S === 'sweep_b') { if (z.t > .5) { set(z, 'idle'); z.cd = 1.3; } return; }
    if (S === 'fall') {
      z.x += z.vx * dt; z.vx *= .92;
      if (z.t > 1.1) { z.phase = 2; z.type = 'guanhai'; set(z, 'roar'); say('管亥：「老子宰了你！」', 2.5); vo('rage'); sfx('finisher', z.x); shake = .25; }
    }
  }

  function phase2(z, dt, dx, ad, ady, L, Rr) {
    const S = z.st, rage = z.hp <= HP * .25, sp = rage ? 1.3 : 1;
    if (S === 'roar') { if (z.t > 1.4) { set(z, 'idle'); z.cd = .8; z.spinCd = 5; } return; }
    if (S === 'stagger') { if (z.t > .9) { set(z, 'idle'); z.cd = .4; } return; }
    if (S === 'dizzy') { if (z.t > 1.6) { set(z, 'idle'); z.cd = .5; } return; }
    // 手里没戟（还插在地上）→ 必须回去捡。之前被玩家打断会停在 idle，戟就永远留在地上了
    if (z.spear && !['throw_a', 'bare', 'leap', 'pickup'].includes(S)) { set(z, 'leap'); z.pickX = z.spear.x; return; }
    z.spinCd = (z.spinCd || 0) - dt;
    // TODO(待补美术/待做)：二阶段缺位移技能「突进刺」——
    // 现在他走得太慢（34，狂暴 44），主角 70 只要后退就永远追不上。
    // 计划：距离 > 70 时发动，前摇 0.5s → 冲刺 0.35s（约 90 单位）→ 收招硬直 0.5s，冷却约 5s。
    // 冲刺帧暂时可以用 thrust_a / thrust_b 顶替，正式美术见 AGENTS.md「待补美术」。
    if (S === 'idle' || S === 'walk') {
      z.f = Math.sign(dx) || z.f;
      if (z.cd <= 0) {
        if (z.throwCd <= 0 && ad > 150 && ady < 30) { set(z, 'throw_a'); z.throwCd = 10; sfx('bladeAlert', z.x); return; }
        if (z.dashCd <= 0 && ad > 85) { set(z, 'dash_a'); z.dashCd = 5.5; sfx('bladeAlert', z.x); return; }
        if (z.spinCd <= 0 && ad < 140) { set(z, 'spin'); z.spinCd = 9; sfx('bladeAlert', z.x); return; }

    if (z.blockHits.length < NEED || !canEnter(z)) return false;
    z.blockHits = [];
    z.blockT = STANCE;
    z.blockCdUntil = gameT + STANCE + COOLDOWN;
    z.blockChargeT = 0;
    effect(z);
    return true;
  }
  function tryStun(z, traits) {
    if (!isBoss(z) || z.dead || !traits || !traits.dazeChance) return false;
    if (Math.random() >= traits.dazeChance) return false;
    const time = traits.dazeTime || .6;
    z.daze = Math.max(z.daze || 0, time);
    z.stun = Math.max(z.stun || 0, time);
    return true;
  }
  // moveFn(z, tx, ty, speed, dt)：沿用各首领自己的移动函数。
  function update(z, dt, moveFn, baseSpeed) {
    if ((z.blockT || 0) > 0) {
      z.blockT = Math.max(0, z.blockT - dt);
      z.f = Math.sign(hero.x - z.x) || z.f;
      if (z.blockT <= 0) {
        z.blockChargeT = 1.5;
        z.blockCdUntil = gameT + COOLDOWN;   // 冷却从架势结束开始
      }
      return true;
    }
    if ((z.blockChargeT || 0) > 0) {
      z.blockChargeT = Math.max(0, z.blockChargeT - dt);
      const dx = hero.x - z.x, dy = hero.y - z.y, d = Math.hypot(dx, dy) || 1;
      z.f = Math.sign(dx) || z.f;
      if (d > 30 && z.blockChargeT > 0 && typeof moveFn === 'function') moveFn(z, hero.x, hero.y, (baseSpeed || z.T.spd || 30) * 1.5, dt);
      if (d <= 30 || z.blockChargeT <= 0) z.blockChargeT = 0;
      return true;
    }
    return false;
  }
  function draw(z) {
    if (!z || (z.blockT || 0) <= 0) return;
    const shield = z.type === 'zhang_bao' || z.sprite === 'zhang_bao';
    const pulse = .72 + .28 * Math.sin(gameT * 10);

      ctx.strokeStyle = `rgba(255,221,126,${.78 + .16 * pulse})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(9, -43, 20, 47, 4) : ctx.rect(9, -43, 20, 47); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,238,174,.9)'; ctx.lineWidth = 1;
      ctx.strokeRect(13, -36, 12, 34);
      ctx.beginPath(); ctx.moveTo(15, -30); ctx.lineTo(23, -30); ctx.moveTo(15, -23); ctx.lineTo(23, -23); ctx.moveTo(15, -16); ctx.lineTo(23, -16); ctx.stroke();
      ctx.beginPath(); ctx.arc(19, -11, 3, 0, 7); ctx.stroke();
    } else {
      ctx.strokeStyle = `rgba(255,221,126,${.62 + .25 * pulse})`;
      ctx.shadowColor = 'rgba(255,198,78,.8)'; ctx.shadowBlur = 8;
      ctx.lineWidth = 2.4;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(0, -22, 23 + i * 4, -1.12, 1.12); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,245,190,.9)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, -22, 31, -.95, .95); ctx.stroke();
    }
    ctx.restore();
  }
  window.BOSS_BLOCK = { isBoss, isBlocking, recordRanged, tryStun, update, draw, effect };
})();

// 第二章首领技能：张梁（重甲大刀，硬拼型）、张宝（术士，远近都能打）。
// 挂在 updateChapter2Boss 里：CH2B.update(z, dt) 返回 true 表示这一帧由技能接管。
// 敌方特效一律暗橙土红，不加白色金色高光。
(() => {
  const hz = [];   // 地面危险物：火球落点等
  const near = (z, rx, ry) => Math.abs(hero.x - z.x) < rx && Math.abs(hero.y - z.y) < ry;
  const front = (z, r) => (hero.x - z.x) * z.f > -8 && Math.abs(hero.x - z.x) < r && Math.abs(hero.y - z.y) < 16;
  const face = z => { z.f = Math.sign(hero.x - z.x) || z.f; };
  const set = (z, k, fr, extra = {}) => { z.cb = { k, t: 0, ...extra }; z.cbFrame = fr; z.st = 'move'; };
  const done = (z, cd) => { z.cb = null; z.cbFrame = null; z.cd = cd; z.st = 'move'; z.t = 0; };
  const tip = (z, txt) => floaters.push({ x: z.x, y: z.y - 62, t: 0, txt });
  const vo = n => { if (window.SFX && SFX.voice) SFX.voice(n); };
  const LINES = { zhang_liang: { intro: ['张梁：「人公将军张梁在此！谁敢上前！」', 'zl_intro'], die: ['张梁：「大哥……我……顶不住了……」', 'zl_die'] },
    zhang_bao: { intro: ['张宝：「地公将军在此……你来送死吗？」', 'zb_intro'], die: ['张宝：「大哥……黄天……救我……」', 'zb_die'] } };
  const armor = z => { z.stun = 0; z.daze = 0; };   // 霸体：挨打不中断

  // ---------------- 张梁 ----------------
  function liang(z, dt) {
    const C = z.cb, fast = z.rage ? .8 : 1;
    if (!z.rage && !z.fled && z.hp < z.T.hp * .5) {   // 半血怒吼：震开主角、召大刀兵、提速
      z.rage = true; z.T = { ...z.T, spd: z.T.spd * 1.25 }; set(z, 'roar', 'roar'); face(z);
      say('张梁：「都给我上！杀！」', 2.4); vo('zl_roar'); shake = .4; sfx('finisher', z.x);
      return true;
    }
    if (C) {
      C.t += dt;
      if (C.k === 'roar') {
        armor(z);
        if (C.t < .35 && near(z, 70, 30)) moveEnt(hero, Math.sign(hero.x - z.x) * 260 * dt, 0);
        if (C.t > .3 && !C.sum) { C.sum = true; z.summonedHalf = false; chapter2BossSummon(z); }
        if (C.t > 1.1) done(z, .4);
        return true;
      }
      if (C.k === 'combo') {   // 两连劈：横劈带剑气 → 重劈
        if (z.stun > 0) { done(z, .6); return false; }
        if (C.step === 0) { z.cbFrame = 'wind'; if (C.t > .55 * fast) { C.step = 1; C.t = 0; z.cbFrame = 'slash'; sfx('enemySwing', z.x);
            if (front(z, 42)) dmgHero(2, z);
            eshots.push({ k: 'enemyWave', x: z.x + z.f * 16, y: z.y, vx: z.f * 170, left: 90, t: 0, life: 1, source: z }); } }
        else if (C.step === 1) { if (C.t > .4 * fast) { C.step = 2; C.t = 0; z.cbFrame = 'wind'; } }
        else if (C.step === 2) { if (C.t > .3 * fast) { C.step = 3; C.t = 0; z.cbFrame = 'smash'; sfx('enemySwing', z.x); shake = Math.max(shake, .25);
            if (front(z, 46)) dmgHero(3, z);
            for (let i = 0; i < 10; i++) propFx.push({ x: z.x + z.f * 30 + rnd(-8, 8), y: z.y - 2, vx: rnd(-60, 60), vy: rnd(-120, -40), w: 2, h: 2, life: .45, max: .45, c: '#7a4a2a' }); } }
        else if (C.t > .8) done(z, 1);
        return true;
      }
      if (C.k === 'spin') {   // 回旋斩：霸体转 1 秒，转完头晕
        if (C.step === 0) { armor(z); z.cbFrame = 'wind'; if (C.t > .45) { C.step = 1; C.t = 0; C.hitT = 0; z.cbFrame = 'spin'; sfx('enemySwing', z.x); } }
        else if (C.step === 1) {
          armor(z); C.hitT -= dt; z.f = Math.floor(C.t * 10) % 2 ? 1 : -1;
          const dx = hero.x - z.x, dy = hero.y - z.y; moveEnt(z, Math.sign(dx) * 22 * dt, Math.sign(dy) * 10 * dt);
          if (C.hitT <= 0 && near(z, 48, 18)) { C.hitT = .45; dmgHero(2, z); }
          if (C.t > 1.1) { C.step = 2; C.t = 0; z.cbFrame = 'dizzy'; tip(z, '晕……'); face(z); }
        } else if (C.t > (z.rage ? 1 : 1.4)) done(z, .8);
        return true;
      }
      if (C.k === 'charge') {   // 冲锋：蓄力后直线冲，撞到拒马就撞碎、自己停下发晕
        if (C.step === 0) { z.cbFrame = 'wind'; armor(z); if (C.t > .6) { C.step = 1; C.t = 0; z.cbFrame = 'charge'; C.dist = 0; sfx('enemySwing', z.x); } }
        else if (C.step === 1) {
          armor(z); const step = 250 * dt, x0 = z.x; moveEnt(z, z.f * step, 0); C.dist += Math.abs(z.x - x0);
          if (!C.hit && near(z, 22, 14)) { C.hit = true; dmgHero(3, z); }
          if (z.bx) {   // 撞到障碍
            const p = props.filter(q => q.solid && !q.broken && /^jumo(_v|_vs)?$/.test(q.g) && Math.abs(propXAt(q, z.y) - z.x) < 40 && propDY(q, z.y) < 24).sort((a, b) => Math.abs(propXAt(a, z.y) - z.x) - Math.abs(propXAt(b, z.y) - z.x))[0];
            if (p) { p.hp = 1; p.hitT = 0; hitProp(p, z.f); tip(z, '咚！'); }
            shake = .35; sfx('land', z.x); C.step = 2; C.t = 0; z.cbFrame = 'dizzy';
          } else if (C.dist > 150 || z.x < arenaL + 14 || z.x > lockR - 14) { C.step = 2; C.t = 0; C.stunT = .5; z.cbFrame = 'wind'; }
        } else if (C.t > (C.stunT || 1.1)) done(z, .6);
        return true;
      }
    }
    // 选招
    z.spinCd = (z.spinCd ?? 3) - dt; z.chargeCd = (z.chargeCd ?? 2) - dt;
    const dx = Math.abs(hero.x - z.x), dy = Math.abs(hero.y - z.y);
    if (z.stun > 0) return false;
    if (z.chargeCd <= 0 && dx > 110 && dy < 14) { z.chargeCd = z.rage ? 4.5 : 6.5; face(z); set(z, 'charge', 'wind', { step: 0 }); tip(z, '冲！'); if (!z.saidCharge || Math.random() < .35) { z.saidCharge = true; say('张梁：「给我——滚开！」', 1.8); vo('zl_charge'); } return true; }
    if (z.spinCd <= 0 && dx < 50 && dy < 16) { z.spinCd = z.rage ? 5 : 7; face(z); set(z, 'spin', 'wind', { step: 0 }); tip(z, '转！'); return true; }
    if (z.cd <= 0 && dx <= z.T.reach && dy <= 10) { face(z); set(z, 'combo', 'wind', { step: 0 }); sfx('bladeAlert', z.x); return true; }
    return false;
  }

  // ---------------- 张宝 ----------------
  function bao(z, dt) {
    const C = z.cb, fast = z.rage ? .8 : 1;
    if (!z.rage && !z.fled && z.hp < z.T.hp * .5) {   // 半血：黄沙迷阵 + 召 4 个方士
      z.rage = true; set(z, 'sand', 'chant'); face(z);
      say('张宝：「黄沙迷阵——众弟子，助我！」', 2.6); vo('zb_sand'); shake = .3;
      return true;
    }
    if (C) {
      C.t += dt;
      if (C.k === 'sand') {
        armor(z);
        if (C.t > .8 && !C.sum) { C.sum = true; z.summonedHalf = false; chapter2BossSummon(z);
          const mid = (M.top + M.bot) / 2; spawn('priest', z.x + z.f * 40, mid - 40); spawn('priest', z.x + z.f * 40, mid + 40); sand.t = 9; }
        if (C.t > 1.4) done(z, .3);   // 放完立刻行动，不喘
        return true;
      }
      if (C.k === 'slash') {   // 小伤害劈砍
        if (z.stun > 0) { done(z, .5); return false; }
        if (!C.hit && C.t > .4 * fast) { C.hit = true; z.cbFrame = 'strike'; sfx('enemySwing', z.x); if (front(z, 38)) dmgHero(1.2, z); }
        if (C.t > .4 * fast + .45) done(z, .7);
        return true;
      }
      if (C.k === 'breath') {   // 往前喷火：0.5 秒前摇（地上土红预警条），喷 0.9 秒
        if (C.step === 0) { if (C.t > .5) { C.step = 1; C.t = 0; sfx('sling', z.x); } }
        else if (C.step === 1) {
          armor(z); C.tick = (C.tick || 0) - dt;
          const ahead = (hero.x - z.x) * z.f;
          if (C.tick <= 0 && ahead > 6 && ahead < 115 && Math.abs(hero.y - z.y) < 13) { C.tick = .35; dmgHero(1.5, z, 'skill'); }
          if (C.t > .9) { done(z, .3); return true; }
        } else if (C.t > .8) done(z, .8);
        return true;
      }
      if (C.k === 'rain') {   // 召火球：举手 0.8 秒，主角周围砸下一片火球
        armor(z);
        if (!C.cast && C.t > .5) { C.cast = true;
          const n = z.rage ? 7 : 5;
          for (let i = 0; i < n; i++) {
            const x = i === 0 ? hero.x : hero.x + rnd(-70, 70), y = i === 0 ? hero.y : Math.max(M.top + 6, Math.min(M.bot - 4, hero.y + rnd(-26, 26)));
            hz.push({ k: 'ball', x, y, t: -(1.1 + i * .18), r: 17 });
          } }
        if (C.t > .9) done(z, .3);
        return true;
      }
    }
    z.breathCd = (z.breathCd ?? 2) - dt; z.rainCd = (z.rainCd ?? 4) - dt;
    if (z.stun > 0) return false;
    const ahead = (hero.x - z.x) * Math.sign(hero.x - z.x), dy = Math.abs(hero.y - z.y);
    if (z.rainCd <= 0) { z.rainCd = z.rage ? 6 : 8.5; face(z); set(z, 'rain', 'fireball'); say('张宝：「天火，降！」', 1.4); if (!z.saidFire || Math.random() < .35) { z.saidFire = true; vo('zb_fire'); } return true; }
    if (z.breathCd <= 0 && ahead > 36 && ahead < 105 && dy < 18) { z.breathCd = z.rage ? 4 : 5.5; face(z); set(z, 'breath', 'breath', { step: 0 }); return true; }
    if (z.cd <= 0 && ahead <= z.T.reach && dy <= 10) { face(z); set(z, 'slash', 'wind'); return true; }
    return false;
  }

  // 黄沙迷阵：全场昏黄，9 秒
  const sand = { t: 0 };

  function update(z, dt) {
    const L = LINES[z.type];
    if (z.dead) { if (L && !z.saidDie) { z.saidDie = true; say(L.die[0], 3.5); vo(L.die[1]); hz.length = 0; sand.t = 0; } z.cb = null; z.cbFrame = null; return false; }
    if (L && !z.saidIntro) { z.saidIntro = true; say(L.intro[0], 3); vo(L.intro[1]); }

  }

      }
      if (z.cb.k === 'charge' && z.cb.step === 0) { ctx.fillStyle = 'rgba(150,60,30,.28)'; ctx.fillRect(Math.min(z.x, z.x + z.f * 150), z.y - 4, 150, 8); }
      if (z.cb.k === 'spin' && z.cb.step === 0) { ctx.strokeStyle = 'rgba(160,70,35,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(z.x, z.y, 48, 18, 0, 0, 7); ctx.stroke(); }
    }
    // 火球：落点暗橙预警圈 + 从天上掉下来的火球
    for (const h of hz) {
      if (h.k !== 'ball') continue;
      if (h.t < 0) {
        const u = Math.max(0, 1 + h.t / 1.1);
        ctx.strokeStyle = `rgba(170,76,44,${.35 + .5 * u})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * .42, 0, 0, 7); ctx.stroke();
        if (h.t > -.45) { const fy = h.y - 140 * (-h.t / .45); ctx.fillStyle = '#b8481f'; ctx.beginPath(); ctx.arc(h.x, fy - 6, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#e07a3a'; ctx.beginPath(); ctx.arc(h.x, fy - 7, 2.5, 0, 7); ctx.fill(); }
      } else { const u = h.t / .5; ctx.fillStyle = `rgba(160,60,25,${.5 * (1 - u)})`; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r * (1 + u * .4), h.r * .45 * (1 + u * .4), 0, 0, 7); ctx.fill(); }
    }
    if (sand.t > 0) { const a = Math.min(1, sand.t, (9 - sand.t) * 2) * .22; ctx.fillStyle = `rgba(170,130,60,${a})`; ctx.fillRect(cam.x - 4, 0, viewW() + 8, 600); }
  }
  function reset() { hz.length = 0; sand.t = 0; }

  window.CH2B = { update, draw, reset, sandOn: () => sand.t > 0 };
})();

// 第二章开场：管亥伏诛后拔营赶赴主战场。由正式章节入口调用；对白期间冻结战斗。
(() => {
  const LINES = [
    { speaker: '旁白', portrait: null, text: '管亥伏诛，村庄暂得安宁。你随皇甫嵩、曹操所部拔营起行，赶赴黄巾主战场。' },
    { speaker: '传令兵', portrait: 'messenger', text: '禀骑都尉！张角已病故，然黄巾贼众顽抗不退！张梁、张宝各率残部护送张角棺椁，正企图北撤！' },
    { speaker: '曹操', portrait: 'caocao', text: '张角既死，贼众为何反倒死战不退？……那具棺椁里，恐怕另有蹊跷。' },
    { speaker: '曹操', portrait: 'caocao', text: '传我军令，全速追击！截下棺椁，看看他们到底在护送什么！' },
  ];
  const S = { active: false, index: 0, chars: 0, charClock: 0, t: 0, done: null };
  const TYPE_SPEED = .035;

  function start(onDone) {
    S.active = true; S.index = 0; S.chars = 0; S.charClock = 0; S.t = 0; S.done = onDone;
  }

  function finish() {
    S.active = false;
    const done = S.done; S.done = null;
    if (typeof done === 'function') done();
  }

  function advance() {
    if (!S.active) return;
    const line = LINES[S.index];
    if (S.chars < line.text.length) {
      S.chars = line.text.length;
      S.charClock = 0;
      return;
    }
    S.index++;
    if (S.index >= LINES.length) { finish(); return; }
    S.chars = 0; S.charClock = 0;
  }
  function skip() {
    if (!S.active) return;
    finish();
  }

  function onPointer(e) {
    if (!S.active) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    const target = e.target;
    if (target && target.closest && target.closest('#bR')) skip();
    else advance();
  }
  function onKey(e) {
    if (!S.active) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if (e.repeat) return;
    if (e.code === 'KeyK') { skip(); return; }
    if (e.code === 'KeyJ' || e.code === 'Space' || e.code === 'Enter') advance();
  }
  document.addEventListener('pointerdown', onPointer, true);
  document.addEventListener('keydown', onKey, true);

  function wrapText(ctx, text, maxWidth) {
    const lines = []; let line = '';
    for (const ch of text) {
      if (line && ctx.measureText(line + ch).width > maxWidth) { lines.push(line); line = ch; }
      else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  }

  function rounded(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); }
  }

  function drawPortrait(ctx, line, x, y, size) {
    if (!line.portrait) return;
    const im = IMG['dialog_' + line.portrait];
    if (!im || !im.complete || !im.naturalWidth) return;
    ctx.save();
    rounded(ctx, x, y, size, size, 5); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    const scale = Math.max(size / im.width, size / im.height);
    const w = im.width * scale, h = im.height * scale;
    ctx.drawImage(im, x + (size - w) / 2, y + (size - h) / 2, w, h);
    ctx.restore();
  }

  function draw() {
    if (!S.active) return;
    const W = cv.width / DPR, H = cv.height / DPR;
    const line = LINES[S.index];
    const small = H < 520 || W < 760;
    const panelW = Math.min(W - (small ? 18 : 36), 1240);
    const panelH = small ? 130 : 176;
    const px = (W - panelW) / 2;
    const py = Math.max(14, Math.min(H * .075, H - panelH - 70)) + (1 - Math.min(1, S.t / .22)) * -12;
    const avatar = line.portrait ? (small ? 88 : 142) : 0;
    const left = px + (line.portrait ? avatar + (small ? 24 : 34) : (small ? 20 : 34));
    const rightPad = small ? 16 : 28;
    const nameY = py + (small ? 28 : 38);
    const bodyY = py + (small ? 61 : 82);
    const fontSize = small ? 17 : 22;
    const maxLines = small ? 3 : 2;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();
    ctx.globalAlpha = Math.min(1, S.t / .18);
    // 开场使用确定好的黄昏主战场底图，保持整张构图完整铺满屏幕。
    const bg = IMG.chapter2_intro;
    if (bg && bg.complete && bg.naturalWidth) {
      const scale = Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
      const bw = bg.naturalWidth * scale, bh = bg.naturalHeight * scale;
      ctx.drawImage(bg, (W - bw) / 2, (H - bh) / 2, bw, bh);
    }
    // 轻压底图亮度，让对白更清晰，同时仍能看清战场细节。
    ctx.fillStyle = 'rgba(18,12,10,.22)'; ctx.fillRect(0, 0, W, H);
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(30,22,18,.91)'; rounded(ctx, px, py, panelW, panelH, 8); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.lineWidth = 2; ctx.strokeStyle = '#e5c98a'; rounded(ctx, px + 1, py + 1, panelW - 2, panelH - 2, 7); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,238,194,.38)'; rounded(ctx, px + 6, py + 6, panelW - 12, panelH - 12, 5); ctx.stroke();

    if (line.portrait) {
      const ax = px + (small ? 10 : 12), ay = py + (small ? 10 : 12);
      ctx.fillStyle = '#b78b4d'; rounded(ctx, ax - 3, ay - 3, avatar + 6, avatar + 6, 6); ctx.fill();
      ctx.fillStyle = '#241912'; rounded(ctx, ax, ay, avatar, avatar, 4); ctx.fill();
      drawPortrait(ctx, line, ax, ay, avatar);
    }

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = `700 ${small ? 17 : 24}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillStyle = '#f1cf75'; ctx.fillText(line.speaker, left, nameY);
    const nameW = ctx.measureText(line.speaker).width;
    ctx.fillStyle = 'rgba(211,165,83,.8)'; ctx.fillRect(left, nameY + 6, Math.min(nameW + 14, panelW * .26), 1.5);

    ctx.font = `700 ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillStyle = '#f7f0df';
    const shown = line.text.slice(0, S.chars);
    const lines = wrapText(ctx, shown, Math.max(80, panelW - (left - px) - rightPad)).slice(0, maxLines);
    lines.forEach((text, i) => ctx.fillText(text, left, bodyY + i * (small ? 23 : 31)));

    // 右下角两块并排的小圆牌：J/攻击快进，K/翻滚整段跳过。
    const labels = small ? ['攻击 快进', '翻滚 跳过'] : ['J 快进', 'K 跳过'];
    const badgeW = small ? 70 : 88, badgeH = small ? 34 : 38, gap = small ? 7 : 9;
    const hx = px + panelW - badgeW * 2 - gap, hy = py + panelH + (small ? 8 : 12);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    labels.forEach((label, i) => {
      const x = hx + i * (badgeW + gap);
      ctx.fillStyle = 'rgba(26,19,17,.88)';
      rounded(ctx, x, hy, badgeW, badgeH, badgeH / 2); ctx.fill();
      ctx.strokeStyle = 'rgba(226,194,130,.48)'; ctx.lineWidth = 1;
      rounded(ctx, x, hy, badgeW, badgeH, badgeH / 2); ctx.stroke();
      ctx.fillStyle = '#f4ead7'; ctx.font = `700 ${small ? 11 : 12}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.fillText(label, x + badgeW / 2, hy + badgeH / 2 + .5);
    });
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  window.CHAPTER2_INTRO = Object.freeze({
    start,
    active: () => S.active,
    blocks: () => S.active,
    update(dt) {
      if (!S.active) return;
      S.t += dt;
      const line = LINES[S.index];
      if (S.chars < line.text.length) {
        S.charClock += dt;
        while (S.charClock >= TYPE_SPEED && S.chars < line.text.length) { S.charClock -= TYPE_SPEED; S.chars++; }
      }
    },
    draw,
  });
})();

// 浏览器和后端共用：按武器UID合并，删除标记胜过旧快照，关卡进度取并集。
(function(root){
  function merge(...profiles){
    const result={items:[],equipped:{},_equipAt:{},_removed:Object.create(null),campaign:{},played:false,migrated:true,wallet:{earned:0,spent:0},fruit:{got:6,used:0},outfit:{hair:0,shirt:0,pants:0,_at:0}};
    const items=new Map();let pityAt=-1,outfitAt=-1;
    const count=(v)=>{const n=Number(v);return Number.isInteger(n)&&n>=0?Math.min(1e9,n):0;};
    const part=(v)=>{const n=Number(v);return Number.isInteger(n)&&n>=0&&n<=7?n:0;};
    for(const p of profiles){if(!p||typeof p!=='object')continue;
      const oa=Number(p.outfit?._at)||0;
      if(oa>outfitAt){outfitAt=oa;result.outfit={hair:part(p.outfit?.hair),shirt:part(p.outfit?.shirt),pants:part(p.outfit?.pants),_at:oa};}
      result.wallet.earned=Math.max(result.wallet.earned,count(p.wallet?.earned));
      result.wallet.spent=Math.max(result.wallet.spent,count(p.wallet?.spent));
      result.fruit.got=Math.max(result.fruit.got,count(p.fruit?.got));
      result.fruit.used=Math.max(result.fruit.used,count(p.fruit?.used));
      result.played ||= !!p.played;
      for(const chapter of ['1','2'])if(p.campaign?.[chapter])result.campaign[chapter]=true;
      for(const chapter of ['1','2']) {
        const floor=Number(p.campaign?.xiaochang?.[chapter]);
        if(Number.isInteger(floor)&&floor>=1&&floor<=6){result.campaign.xiaochang ||= {};result.campaign.xiaochang[chapter]=Math.max(result.campaign.xiaochang[chapter]||0,floor);}
      }
      // 熔炼保底计数：以最后一次熔炼的那份为准
      if(p.pity&&typeof p.pity==='object'&&(Number(p._pityAt)||0)>pityAt){pityAt=Number(p._pityAt)||0;result.pity={};for(const q of ['0','1','2','3']){const n=Math.floor(Number(p.pity[q])||0);if(n>0)result.pity[q]=Math.min(30,n);}result._pityAt=pityAt;}
      // 武器熟练度：经验只增不减，每种武器取最大值
      for(const [t,n] of Object.entries(p.mastery||{})){const v=Math.min(99999,Math.max(0,Math.floor(Number(n)||0)));if(['staff','hammer','stone','halberd','blade','bow'].includes(t)&&v>0){result.mastery ||= {};result.mastery[t]=Math.max(result.mastery[t]||0,v);}}
      for(const [id,time] of Object.entries(p._removed||{}))result._removed[id]=Math.max(result._removed[id]||0,Number(time)||1);
      for(const item of p.items||[]){if(!item||typeof item.uid!=='string')continue;const old=items.get(item.uid);if(!old||(item._at||0)>(old._at||0))items.set(item.uid,item);}
      for(const slot of ['long','short','ranged'])if(Object.prototype.hasOwnProperty.call(p.equipped||{},slot)){
        const t=Number(p._equipAt?.[slot])||0;
        if(!Object.prototype.hasOwnProperty.call(result.equipped,slot)||t>(result._equipAt[slot]||0)||(t===0&&!result.equipped[slot]&&p.equipped[slot])){
          result.equipped[slot]=p.equipped[slot];result._equipAt[slot]=t;
        }
      }
    }
    result.items=[...items.values()].filter(i=>!result._removed[i.uid]);
    for(const slot of ['long','short','ranged'])if(!result.items.some(i=>i.uid===result.equipped[slot]))result.equipped[slot]=null;
    return result;
  }
  root.CLOUD_MERGE={merge};
})(typeof window==='undefined'?globalThis:window);

    if(scroll)pinBox.querySelector('.pause-paper').style.backgroundImage=`url("${scroll}")`;
    pinBox.querySelectorAll('.pause-action').forEach(b=>{if(btn)b.style.backgroundImage=`url("${btn}")`;});
    pinBox.hidden=false;pinBox.style.display='flex';
    const msg=pinBox.querySelector('.pin-msg'),val=id=>(pinBox.querySelector('#'+id)?.value||'').trim();
    setTimeout(()=>pinBox.querySelector('input')?.focus(),30);
    const close=()=>{pinBox.hidden=true;pinBox.style.display='none';};
    pinBox.querySelector('[data-pin="cancel"]').onclick=()=>{close();if(mode==='enter')releasePinWait();};
    pinBox.onkeydown=e=>{if(e.key==='Enter')pinBox.querySelector('[data-pin="ok"]').click();if(e.key==='Escape'){close();if(mode==='enter')releasePinWait();}};
    pinBox.querySelector('[data-pin="ok"]').onclick=async()=>{
      const pin=val('pinNew');
      if(!/^\d{4,6}$/.test(pin)){msg.textContent='口令要4～6位数字';return;}
      if(mode==='enter'){rememberPin(player,pin);pinBlocked.delete(player);close();status(player,'syncing');schedule(player,true);return;}
      if(pin!==val('pinAgain')){msg.textContent='两次输入的口令不一样';return;}
      msg.textContent='保存中…';
      try{
        const r=await fetch('/api/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:player,pin,oldPin:mode==='change'?val('pinOld'):pinFor(player)})});
        const data=await r.json().catch(()=>({}));
        if(!r.ok||!data.ok){msg.textContent=data.error||'设置失败，请稍后再试';return;}
        rememberPin(player,pin);pinSetFor.set(player,true);close();renderStatus();
        const node=document.getElementById('cloudStatus');if(node)node.textContent='口令已设置 · 请记好它';
      }catch{msg.textContent='网络不通，稍后再试';}
    };
  }
  function status(player,phase,detail=''){
    const s=state(player);s.phase=phase;s.detail=detail;if(phase==='ready'){s.at=Date.now();if(player===name())releasePinWait();}
    if(player===name())renderStatus();
  }
  function payload(player){
    if(player===name())return ARMORY.exportProfile();
    try{const p=JSON.parse(localStorage.getItem('wzb-equipment-v2')||'{}')[player]||null;if(p)p.campaign=CLOUD_MERGE.merge({campaign:p.campaign},{campaign:JSON.parse(localStorage.getItem('wzb-campaign-clear-v1')||'{}')[player]}).campaign;return p;}catch{return null;}
  }
  async function request(url,options={},player=''){
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
    try{
      const headers={...(options.headers||{})};const pin=player&&pinFor(player);if(pin)headers['X-Save-Pin']=pin;
      const response=await fetch(url,{...options,headers,signal:controller.signal,cache:'no-store'}),data=await response.json();
      if(!response.ok||!data.ok||!data.profile){const error=new Error(data.error||'同步失败');error.status=response.status;error.data=data;error.profileError=response.status>=400&&response.status<500;throw error;}
      if(player)pinSetFor.set(player,!!data.pinSet);
      return data.profile;
    }finally{clearTimeout(timeout);}
  }
  function merge(remote){
    if(!ARMORY.mergeCloud(remote)){const error=new Error('合并失败：请检查50把容量限制或本机存储空间');error.profileError=true;throw error;}
    return ARMORY.lastMergeChanged?ARMORY.lastMergeChanged():true;
  }
  async function exchange(player,download){
    if(debug||!player||player==='__debug__')return true;
    if(blocked(player)){renderStatus();return false;}
    // 串行队列可能等到玩家已出征才开始；再次检查，不能在战斗中发起下载。
    const pull=download&&player===name()&&canMerge();
    if(download&&!pull&&player===name())wanted.add(player);
    status(player,'syncing');let changed=false;
    try{
      if(pull){
        wanted.add(player);
        const remote=await request('/api/profile?name='+encodeURIComponent(player),{},player);
        // 下载途中出征/换名字：绝不把迟到的结果合进战斗装备，留待下个安全时机。
        if(player===name()&&canMerge()){changed=merge(remote)||changed;wanted.delete(player);}
      }
      const profile=payload(player);if(!profile){status(player,'error');return false;}
      const sent=JSON.stringify(profile),revision=++sequence;
      const remote=await request('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:player,writer,sequence:revision,profile,pin:pinFor(player)})},player);
      if(player===name()){
        const changedDuringRequest=JSON.stringify(payload(player))!==sent;
        if(canMerge())changed=merge(remote)||changed;
        if(changedDuringRequest)pending.add(player);
        // 只有云端真的带来了变化才重画整备页；内容一样就不动页面（不打断勾选）
        if(changed&&canMerge())TITLE.refreshPreparation();
      }
      retryAt=0;status(player,'ready');return true;
    }catch(e){
      if(e.data&&e.data.needPin){
        pinSetFor.set(player,true);
        if(e.data.locked)pinBlocked.set(player,Date.now()+(e.data.retryAfter||10)*60000);else pinBlocked.set(player,'need');
        if(e.data.wrong||e.data.locked)rememberPin(player,'');
        status(player,'needpin',e.data.error);
        if(player===name()&&canMerge())openPin('enter',e.data.error);
        return false;
      }
      pending.add(player);retryAt=Date.now()+15000;
      status(player,'error',e.profileError?e.message:'');return false;
    }
  }
  function schedule(player,download=false){
    if(debug||!player||player==='__debug__'){renderStatus();return Promise.resolve(true);}
    const key=player+':'+download;if(inFlight.has(key))return inFlight.get(key);
    const job=tail.catch(()=>{}).then(()=>exchange(player,download));tail=job;
    inFlight.set(key,job);job.finally(()=>inFlight.delete(key));return job;
  }
  function enterPreparation(){return schedule(name(),true);}
  function queue(player){
    if(debug||!player||player==='__debug__')return;
    pending.add(player);clearTimeout(timer);
    if(navigator.onLine===false)status(player,'error');
    timer=setTimeout(flush,1000);
  }
  async function flush(){
    if(debug||Date.now()<retryAt)return;
    if(navigator.onLine===false){if(pending.size||wanted.has(name()))status(name(),'error');return;}
    const names=new Set(pending);if(wanted.has(name())&&canMerge())names.add(name());pending.clear();
    for(const player of names)await schedule(player,player===name()&&wanted.has(player)&&canMerge());
  }
  function attach(root){
    if(!root.querySelector('#cloudStatus')){
      const style=document.createElement('style');style.textContent='@keyframes cloudSpin{to{transform:rotate(360deg)}}#cloudRetry{padding:2px 6px;min-width:28px;min-height:26px;font-size:20px;line-height:1;border:1px solid #997343;border-radius:50%;background:#38281d;color:#ddc18b;cursor:pointer}#cloudRetry.cloud-spinning{animation:cloudSpin 1s linear infinite}#cloudRetry:disabled{cursor:default;opacity:.65}';document.head.append(style);
      const line=document.createElement('p');line.style.cssText='font-size:12px;color:#d0b980;display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:4px 0;flex:none';
      const label=document.createElement('span');label.id='cloudStatus';label.setAttribute('role','status');label.setAttribute('aria-live','polite');
      const button=document.createElement('button');button.id='cloudRetry';button.type='button';button.textContent='↻';button.title='重新同步存档';button.setAttribute('aria-label','重新同步存档');
      button.onclick=()=>{if(blocked(name()))openPin('enter');else schedule(name(),true);};
      const lock=document.createElement('button');lock.id='cloudPin';lock.type='button';lock.textContent='🔓';lock.onclick=()=>openPin();
      line.append(label,button,lock);root.querySelector('#tPrepHeader')?.after(line);
    }
    renderStatus();
  }
  function watchSettlements(){
    if(debug)return;
    const main=typeof result!=='undefined'&&result&&typeof gameT!=='undefined'&&gameT>=result.born?result:null;
    const arena=window.XIAOCHANG&&XIAOCHANG.blocks()?XIAOCHANG.state():null;
    if(main&&main!==seenMain){seenMain=main;schedule(name(),true);}else if(!main)seenMain=null;
    if(arena&&arena!==seenArena){seenArena=arena;schedule(name(),true);}else if(!arena)seenArena=null;
  }
  window.addEventListener('offline',()=>{if(!debug&&name())status(name(),'error');});
  window.addEventListener('online',()=>{retryAt=0;queue(name());if(canMerge())schedule(name(),true);});
  document.addEventListener('visibilitychange',()=>{
    // 切回页面时下载一次（换设备玩能接上），10秒内最多一次
    if(!document.hidden){if(canMerge()&&Date.now()-lastVisiblePull>10000){lastVisiblePull=Date.now();schedule(name(),true);}else queue(name());}
  });
  setInterval(flush,15000);
  // 不再定时下载：整备页定时刷新会打断勾选、熔错武器。只在进整备页、结算、切回页面、点↻和熔炼前同步。
  setInterval(renderStatus,30000);
  setInterval(watchSettlements,250);
  window.CLOUD_SAVE={queue,attach,enterPreparation,openPin,waitPin,sync:player=>schedule(player,true)};
})();

// 开发者调试面板（只在网址带 ?debug 时出现，普通玩家看不到）

//   ?debug=boss   直接进管亥一阶段（骑马）

(() => {

    #dbg button{display:block; width:100%; min-width:0; height:26px; margin:0; padding:2px 4px;
      font:700 12px/1.1 "PingFang SC",sans-serif; color:#2b1a06;
      background:linear-gradient(180deg,#f7dd8a,#d9a93c); border:1px solid #8a5f12; border-radius:5px;

    #dbg .dbgTrial{grid-column:1/-1; display:flex; gap:3px; align-items:center}
    #dbg .dbgTrial>span{flex:none; color:#cdb98e; font:12px "PingFang SC",sans-serif}
    #dbg .dbgTrial button{flex:1 1 0}
    #dbg .dbgFloors{grid-column:1/-1; display:grid; grid-template-columns:auto repeat(6,minmax(0,1fr)); gap:2px; align-items:center}
    #dbg .dbgFloors>span{color:#cdb98e;font:12px "PingFang SC",sans-serif;white-space:nowrap}
    #dbg .dbgFloors button{padding:1px; font-size:11px}
    #dbg i{display:block; color:#9bb0c9; font-style:normal; font-size:10px; line-height:1.35; margin-top:5px; white-space:pre-line}
  `;
  document.head.appendChild(css);

  const btn = (parent, label, cls, fn) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.addEventListener('click', e => { e.stopPropagation(); fn(); });
    parent.appendChild(b);
    return b;
  };
  function saveGroups() { try { localStorage.setItem('wzb-dbg-groups', JSON.stringify(groupState)); } catch (e) {} }
  function addGroup(key, title) {
    const section = document.createElement('section'); section.className = 'dbgGroup';
    const head = document.createElement('h3'); head.textContent = '【' + title + '】';
    const body = document.createElement('div'); body.className = 'dbgItems';
    section.append(head, body); panel.querySelector('.dbgBody').appendChild(section);
    const apply = () => section.classList.toggle('closed', !!groupState[key]);
    head.addEventListener('click', e => { e.stopPropagation(); groupState[key] = !groupState[key]; apply(); saveGroups(); });
    apply();
    return body;
  }

  function build() {
    panel = document.createElement('div'); panel.id = 'dbg';
    document.body.appendChild(panel);
    const head = document.createElement('b'); head.className = 'dbgHead';
    const body = document.createElement('div'); body.className = 'dbgBody';
    panel.append(head, body);
    const setCollapsed = v => {

      god = !god; godBtn.textContent = god ? '无敌：开' : '无敌：关'; godBtn.className = god ? 'alt' : 'off';
    });
    const revive = btn(heroGroup, '复活次数 +1', '', () => { if (typeof reviveUsed !== 'undefined') reviveUsed = false; });
    revive.classList.add('dbgWide');
    const trial = document.createElement('div'); trial.className = 'dbgTrial';
    const tlabel = document.createElement('span'); tlabel.textContent = '试用：'; trial.appendChild(tlabel);
    for (const [id, label] of [['halberd', '长戟'], ['bow', '汉弓'], ['blade', '大刀']]) {

    // 瞬移主角到新区域入口，并把镜头一起拉过去（否则镜头要滑半天）
    function warpTo(x) {
      hero.x = x; hero.y = (M.top + M.bot) / 2; hero.f = 1; hero.st = 'idle';

    if (god && typeof hero !== 'undefined' && hero) hero.hp = maxHeroHp();

(function(root){
  const CAPACITY=50;
  const upgrades={3:[.10,.06,.03,.01,0],4:[.15,.10,.05,.02,0],5:[.20,.15,.08,.03,0]};

  const PITY_STEP=[.20,.15,.12,.08,0];

  function enemyAttack(z){return (window.XIAOCHANG ? XIAOCHANG.actionScale(z) : 1)*(1-Math.max(z.gearNumb>gameT?(z.gearNumbValue||0):0,z.attackSlowT>0?.1:0));}
  function enemyMove(z){let slow=Math.max(z.gearSlow>gameT?z.gearSlowValue||0:0,z.moveSlowT>0?.15:0);if(z.gearColdUntil>gameT)slow=Math.max(slow,Math.min(3,z.gearCold||0)*.05);return (1-slow)*(window.XIAOCHANG ? XIAOCHANG.moveScale(z) : 1);}
  function incoming(n,from,kind='basic'){const s=sync();if(from&&kind==='basic'&&chance(clamp(stat(s,'dodge'),0,.2))){floaters.push({x:hero.x,y:hero.y-28,t:0,txt:'闪避'});return 0;}

    const reduce=stat(s,'guard')+stat(s,'fragile')+(s.special==='tenacity'?.15*lowHp():0);
    return n*(1-clamp(reduce,-1,.3));
  }
  function tryRevive(){if(sync().special!=='revival'||revived)return false;revived=true;hero.hp=maxHp()*.3;hero.inv=2;hero.air=false;hero.deathArc=false;hero.z=0;hero.ax=0;hero.st='idle';hero.atk=null;hero.vx=0;hero.vz=0;cancelCharge();say('神佑复生！',2);sfx('finisher',hero.x);return true;}
  function skillCd(){return 30*(1-reduction(sync()));}

    const boss=!!(z.T.boss||z.T.chapterBoss),source=boss?'boss':z.T.elite?'elite':'grunt';

    if(chapter2Run){if(TITLE.ownsWeapon('blade'))pool.push('blade');if(TITLE.ownsWeapon('bow'))pool.push('bow');}

    const due=pending.filter(p=>p.t<=gameT);pending=pending.filter(p=>p.t>gameT);for(const p of due)if(p.uid===current.uid&&!over&&!hero.air&&hero.st!=='hurt')p.run();
    for(const z of zs){if(z.dead){dropEnemy(z);if(!z.gearKillRewarded){z.gearKillRewarded=true;if(window.WALLET)WALLET.awardKill(z);const s=z.lastGear;if(s&&s.uid===current.uid){if(stat(s,'victory'))victoryUntil=gameT+4;if(s.special==='soul'||s.special2==='soul')soulUntil=gameT+3;if(chance(stat(s,'survive'))&&ready('survive',1))hero.hp=Math.min(maxHp(),hero.hp+.5);}}continue;}
      if(z.gearDot)for(const entries of Object.values(z.gearDot))for(let i=entries.length-1;i>=0;i--){const e=entries[i];if(e.next<=gameT&&e.next<=e.until){e.next+=1;hit(z,e.damage,0,0,false,0,0,false,false,{secondary:true,scaled:true,dot:true});}if(e.until<=gameT)entries.splice(i,1);}

  window.GEAR={attackScale,snapshot,sync,attackToken,hit:hitPrimary,range,maxHp,speed,tick,draw,incoming,tryRevive,skillCd,refreshSkill,enemyTime,enemyMove,enemyAttack,projectile,projectileTraits,projectileDamage,collectDrops,

    switch(){currentUid='';sync();victoryUntil=-1;soulUntil=-1;chain=0;chainTarget=null;},

})();

// 手机全屏提示：只要用手机打开就强制显示，直到在标题页勾选「关闭提醒」。
// 浏览器一定有工具栏/地址栏，只有"添加到主屏幕"后从桌面图标进入才是真全屏。
(function () {
  const KEY = 'wzb-hint-off';          // 勾选"关闭提醒"后写 '1'

  function ua() { return navigator.userAgent || ''; }
  function isMobile() { return /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(ua()); }
  function isStandalone() {
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function off() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }

  // 常见 App 的内置浏览器（菜单里没有"添加到主屏幕"，必须先"在浏览器打开"）
  const INAPP = [
    [/MicroMessenger/i, '微信'],
    [/AlipayClient/i, '支付宝'],
    [/Weibo/i, '微博'],
    [/aweme|ByteLocale|BytedanceWebview|TikTok/i, '抖音'],
    [/DingTalk/i, '钉钉'],
    [/xhsdiscover|XHS/i, '小红书'],
    [/Kwai|Kuaishou/i, '快手'],
    [/baiduboxapp/i, '百度'],
    [/QQ\/|QQBrowser/i, 'QQ'],
  ];
  function inAppName() {
    const u = ua();
    for (const [re, name] of INAPP) if (re.test(u)) return name;
    return '';
  }

  function text() {
    const u = ua(), app = inAppName();
    if (app) return app + '里玩会留黑边：点右上角「···」→「在浏览器打开」→ 浏览器菜单里「添加到主屏幕」，之后从桌面图标进入才是全屏。';
    if (/Android/i.test(u)) return '加到主屏幕才能全屏：浏览器右上角「⋮」→「添加到主屏幕」，之后从桌面图标进入。';
    if (/iPhone|iPad|iPod/i.test(u)) return '加到主屏幕才能全屏：底部「分享」→「添加到主屏幕」，之后从桌面图标进入。';
    return '加到主屏幕才能全屏：浏览器菜单里选「添加到主屏幕」，之后从桌面图标进入。';
  }

  const CSS = `
  #wzbHint{display:none;position:fixed;left:0;right:0;top:0;z-index:26;
    padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;pointer-events:none}
  body.wzb-title #wzbHint.on{display:flex}
  #wzbHint .box{flex:1;max-width:640px;margin:0 auto;background:rgba(30,20,34,.92);
    border:1.5px solid #c9971f;border-radius:12px;padding:9px 13px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  #wzbHint .tx{color:#f2e6c9;font-size:12.5px;line-height:1.55;letter-spacing:.02em}
  #wzbHint .tail{margin-top:3px;color:#b9a273;font-size:11.5px}`;

  let box = null;

  function ensure() {
    if (box) return;
    if (!document.getElementById('wzbHintCss')) {
      const st = document.createElement('style'); st.id = 'wzbHintCss'; st.textContent = CSS;
      document.head.appendChild(st);
    }
    box = document.createElement('div');
    box.id = 'wzbHint';
    box.innerHTML = '<div class="box"><div class="tx"></div><div class="tail">不想看这条？在标题页勾选「关闭提醒」</div></div>';
    box.querySelector('.tx').textContent = text();
    document.body.appendChild(box);
  }

  // 放在「英雄榜」上方，避开输入框 / 简单模式 / 开始游戏
  function place() {
    if (!box) return;
    const anchor = document.getElementById('tBoard') || document.getElementById('tName') || document.getElementById('tStart');
    const h = box.offsetHeight || 60;
    let top = (innerHeight - h) * 0.35;
    if (anchor) top = Math.max(8, anchor.getBoundingClientRect().top - h - 10);
    box.style.top = Math.round(top) + 'px';
  }

  function tick() {
    if (!box) ensure();
    const landscape = innerWidth > innerHeight;   // 竖屏时游戏的"请横屏"提示更重要，别挡它
    const shouldShow = isMobile() && !isStandalone() && !off() && landscape && document.body.classList.contains('wzb-title');
    const on = box.classList.contains('on');
    if (shouldShow && !on) { box.classList.add('on'); place(); addEventListener('resize', place); }
    else if (!shouldShow && on) box.classList.remove('on');
  }

  setInterval(tick, 500);
  addEventListener('DOMContentLoaded', tick);
})();

// 武器熟练度：按武器种类累计经验，10级；奇数级加攻击（远程更高），偶数级加攻速。
// 战斗中只记在内存里，回到整备页/结算/切后台时才写进存档，避免频繁触发云同步。
(() => {
  const TYPES = ['staff', 'hammer', 'stone', 'halberd', 'blade', 'bow'];
  const NAMES = { staff: '棍子', hammer: '锤子', stone: '石子', halberd: '长戟', blade: '大刀', bow: '汉弓' };
  const RANGED = { stone: true, bow: true };
  const NEED = [60, 180, 360, 600, 900, 1260, 1680, 2160, 2700, 3300];   // 原表×1.2（用户定：升级再慢约20%）   // 升到 Lv.1～10 的累计经验
  let pending = {};   // 本局还没写进存档的经验

  const saved = () => (window.ARMORY && ARMORY.state().mastery) || {};
  const xp = type => (Number(saved()[type]) || 0) + (pending[type] || 0);
  const levelOf = n => { let lv = 0; while (lv < NEED.length && n >= NEED[lv]) lv++; return lv; };
  const level = type => levelOf(xp(type));
  function bonusAt(type, lv) {
    const odd = Math.ceil(lv / 2), even = Math.floor(lv / 2);
    return { dmg: odd * (RANGED[type] ? .02 : .015), aspd: even * .01 };
  }
  const bonus = type => bonusAt(type, level(type));
  function rewardText(type, lv) { return lv % 2 ? '攻击+' + (RANGED[type] ? '2' : '1.5') + '%' : '攻速+1%'; }

  function gain(type, z, killed) {
    if (!NAMES[type] || !z || !z.T) return;
    let n = (z.T.boss || z.T.chapterBoss) ? 2 : 1;
    if (killed) n += 3;
    const hard = (typeof chapter2Run !== 'undefined' && chapter2Run) || (window.XIAOCHANG && XIAOCHANG.active() && (XIAOCHANG.state()?.floor || 1) >= 3);
    if (hard) n *= 1.5;
    const before = level(type);
    pending[type] = (pending[type] || 0) + n;
    const after = level(type);
    if (after > before && typeof floaters !== 'undefined' && typeof hero !== 'undefined')
      floaters.push({ x: hero.x, y: hero.y - 46, t: -.4, txt: NAMES[type] + '熟练 Lv.' + after + ' · ' + rewardText(type, after), gold: true });
  }

  function flush() {
    if (!window.ARMORY || !Object.keys(pending).length) return;
    const next = { ...saved() };
    for (const t of Object.keys(pending)) next[t] = Math.min(99999, Math.round((Number(next[t]) || 0) + pending[t]));
    pending = {};
    ARMORY.setMastery(next);
  }
  // 不在战斗中（标题/整备页、结算画面）时才落盘
  setInterval(() => {
    if (!Object.keys(pending).length) return;
    const settled = typeof result !== 'undefined' && result;
    if ((window.TITLE && TITLE.active()) || settled || (window.XIAOCHANG && XIAOCHANG.blocks())) flush();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  // ---------- 整备页：熟练度面板 ----------
  function rows() {
    return TYPES.map(t => ({ t, n: xp(t), lv: level(t) })).sort((a, b) => b.lv - a.lv || b.n - a.n);
  }
  function summary() {
    const top = rows()[0];
    return top && top.n > 0 ? NAMES[top.t] + ' Lv.' + top.lv : '未修炼';
  }
  function pct(v) { return (Math.round(v * 1000) / 10) + '%'; }
  function open() {
    let box = document.getElementById('masteryPanel');
    if (!box) {
      box = document.createElement('div'); box.id = 'masteryPanel';
      const css = document.createElement('style');
      css.textContent = '#masteryPanel{position:fixed;inset:0;z-index:10002;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;background:#100b08c9;font:14px/1.5 sans-serif}#masteryPanel[hidden]{display:none!important}#masteryPanel section{position:relative;box-sizing:border-box;width:min(560px,94vw);max-height:92dvh;overflow:auto;padding:clamp(14px,3vh,24px) clamp(14px,3vw,26px);background:linear-gradient(#3b2c20,#271c14);border:2px solid #9d7845;border-radius:10px;box-shadow:0 12px 40px #000a;color:#ecdcbc}#masteryPanel h3{margin:4px 0 10px;text-align:center;font:700 22px MaShanZheng,"STKaiti",serif;color:#f1d58f}#masteryPanel .mx{position:absolute;right:clamp(14px,4vw,30px);top:clamp(12px,3vh,24px);border:1px solid #8a6538;background:#5a3923;color:#f5dfb2;border-radius:6px;padding:2px 9px;cursor:pointer}#masteryPanel .mr{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;align-items:center;padding:6px 8px;margin:4px 0;background:#35271de8;border:1px solid #805d37;border-radius:6px;color:#ecdcbc}#masteryPanel .mr.dim{opacity:.55}#masteryPanel .mr img{width:30px;height:30px;object-fit:contain;grid-row:span 3;image-rendering:pixelated}#masteryPanel .mh{display:flex;justify-content:space-between;font-weight:700}#masteryPanel .mh b{color:#f1d58f}#masteryPanel .mb{height:6px;background:#1c140e;border-radius:3px;overflow:hidden}#masteryPanel .mb i{display:block;height:100%;background:linear-gradient(90deg,#c9953e,#f1d58f)}#masteryPanel .ms{font-size:12px;color:#cdb78e}#masteryPanel .mn{margin:10px 0 0;font-size:12px;color:#cdb78e;text-align:center}@media(max-height:450px){#masteryPanel section{padding:14px 26px}#masteryPanel .mr{padding:3px 6px;margin:3px 0}#masteryPanel h3{font-size:18px;margin:0 0 6px}}';
      document.head.append(css); document.body.append(box);
      box.addEventListener('click', e => { if (e.target === box || e.target.closest('.mx')) box.hidden = true; });
    }
    const icon = t => (typeof ASSETS !== 'undefined' && ASSETS.ui && ASSETS.ui['w_' + t]) || '';
    box.innerHTML = '<section><button class="mx" type="button">关闭</button><h3>武器熟练度</h3>' + rows().map(({ t, n, lv }) => {
      const b = bonusAt(t, lv), lo = lv ? NEED[lv - 1] : 0, hi = NEED[lv];
      const bar = lv >= 10 ? 100 : Math.max(0, Math.min(100, (n - lo) / (hi - lo) * 100));
      const now = lv ? '攻击+' + pct(b.dmg) + (b.aspd ? ' 攻速+' + pct(b.aspd) : '') : '暂无加成';
      const next = lv >= 10 ? '已精通' : '下一级：' + rewardText(t, lv + 1);
      return '<div class="mr' + (n > 0 ? '' : ' dim') + '"><img src="' + icon(t) + '" alt=""><div class="mh"><span>' + NAMES[t] + '</span><b>Lv.' + lv + '</b></div><div class="mb"><i style="width:' + bar + '%"></i></div><div class="ms">' + (lv >= 10 ? Math.floor(n) : Math.floor(n) + ' / ' + hi) + ' · ' + now + ' · ' + next + '</div></div>';
    }).join('') + '<p class="mn">用哪种武器打中敌人，哪种武器的熟练度就会提升。远程武器每级攻击加成更高。</p></section>';
    box.hidden = false;
  }

  window.MASTERY = { TYPES, NAMES, NEED, xp, level, bonus, gain, flush, summary, open };
})();

})();
