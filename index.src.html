<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>无名之辈·序章 幻想三国录</title><style>
html,body{margin:0;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:#1a1020;font-family:system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px calc(10px + env(safe-area-inset-left));align-items:center;flex-wrap:wrap;z-index:2;pointer-events:none}
button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.55);background:rgba(20,14,30,.35);color:#fff;text-shadow:0 1px 2px #000;border-radius:7px;padding:4px 8px;touch-action:none}
button.on{background:rgba(255,216,110,.85);color:#2a2234;text-shadow:none;border-color:#ffd86e}
#wp{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top));display:flex;gap:5px;z-index:3}
#joy{position:fixed;left:0;bottom:0;width:50%;height:70%;z-index:1;touch-action:none}
#base{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:25px;top:25px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.4)}
.big{position:fixed;z-index:3;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.5);color:#fff;text-shadow:0 1px 3px #000}
.big:active{background:rgba(255,255,255,.3)}
/* 透明按钮，贴近右下角 */
#bA{right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:72px;height:72px;background:rgba(210,60,48,.28);border-color:rgba(255,160,150,.7)}
#bA:active{background:rgba(210,60,48,.5)}
#bA::after{content:"";position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;background:conic-gradient(from -90deg,#ffe08a 0deg var(--charge-angle,0deg),rgba(255,224,138,.12) var(--charge-angle,0deg) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#bA.charging::after{opacity:1;filter:drop-shadow(0 0 4px rgba(255,210,100,.8))}
#bA.charged::after{animation:charge-pulse .65s ease-in-out infinite alternate}
@keyframes charge-pulse{to{filter:drop-shadow(0 0 9px #8de5ff)}}
#bR{right:calc(96px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:13px}
#help{position:fixed;left:10px;bottom:8px;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none}
body.wzb-rogue #top,body.wzb-rogue #wp,body.wzb-rogue #joy,body.wzb-rogue .big,body.wzb-rogue #help{display:none}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#1a1020;color:#ffd86e;font-size:20px;font-weight:800;align-items:center;justify-content:center;text-align:center;line-height:1.8}
@media (pointer:coarse){#help{display:none}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
</style>__FONT_FACE__</head><body>
<canvas id="c"></canvas>
<div id="rot">📱↻<br>请把手机横过来玩</div>
<div id="top"><b style="font-size:13px;color:#fff;text-shadow:0 1px 3px #000">无名之辈·序章 幻想三国录 · 黄巾流寇</b></div>
<div id="wp"><button data-w="staff">棍</button><button data-w="hammer">锤子</button><button data-w="stone">石子</button><button id="bMute" type="button" aria-label="静音" title="静音">🔊</button></div>
<div id="joy"><div id="base"><div id="knob"></div></div></div>
<button class="big" id="bR">翻滚</button><button class="big" id="bA">攻击</button>
<div id="help">电脑：WASD/方向键移动 · J 攻击/长按蓄力（棍四连击，锤/石子三连击）· K/空格 翻滚 · 1/2/3 换武器 · R 重来</div>
<script>const ASSETS=__ASSETS__;</script><script>const BG=__BG__;</script><script>__GAME__</script></body></html>
